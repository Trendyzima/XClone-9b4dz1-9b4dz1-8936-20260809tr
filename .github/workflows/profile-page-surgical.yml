name: ProfilePage Surgical Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-page-surgical.yml'

permissions:
  contents: read

jobs:
  workflow-registration-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify workflow registration without touching ProfilePage
        shell: bash
        run: |
          set -euo pipefail
          test -f src/pages/ProfilePage.tsx
          sha256sum src/pages/ProfilePage.tsx
          git diff --exit-code -- src/pages/ProfilePage.tsx
          echo 'PROFILEPAGE_MUTATION_NOT_EXECUTED'
