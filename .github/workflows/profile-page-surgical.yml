name: ProfilePage Surgical Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-page-surgical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surgical-profile-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Surgical transform and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          path = Path('src/pages/ProfilePage.tsx')
          source = path.read_text(encoding='utf-8')
          original_hash = hashlib.sha256(source.encode()).hexdigest()

          def exactly(text, needle, expected=1):
              count = text.count(needle)
              if count != expected:
                  raise SystemExit(f'ABORT: expected {expected} occurrences of {needle!r}, found {count}')

          exactly(source, "import { StoryHighlights } from '@/components/features/StoryHighlights';")
          exactly(source, 'ProfileCompactActions', 0)
          exactly(source, 'ProfileCreatorTools', 0)
          exactly(source, '{/* Tabs */}')
          if source.count('setShowGiftPremiumDialog(true)') != 1:
              raise SystemExit('ABORT: Gift Premium state callback count is not exactly one')
          for needle in ['handleFollow', 'handleMessage', 'handleUnsubscribe', 'handleMute', 'handleBlock']:
              if source.count(needle) < 1:
                  raise SystemExit(f'ABORT: missing required handler {needle}')

          import_anchor = "import { StoryHighlights } from '@/components/features/StoryHighlights';"
          imports = import_anchor + "\nimport { ProfileCompactActions } from '@/components/features/ProfileCompactActions';\nimport { ProfileCreatorTools } from '@/components/features/ProfileCreatorTools';"
          transformed = source.replace(import_anchor, imports, 1)

          opening = '<div className="flex gap-2 mt-2 flex-wrap items-center">'
          ending = '          <div className="mb-3">'
          exactly(transformed, opening)
          exactly(transformed, ending)
          start = transformed.index(opening)
          end = transformed.index(ending, start)
          if end <= start:
              raise SystemExit('ABORT: invalid action cluster boundaries')

          action = '''<div className="flex gap-2 mt-2 flex-wrap items-center">
            <ProfileCompactActions
              isOwnProfile={isOwnProfile}
              username={profile.username}
              verified={profile.verified}
              isCreator={profile.is_creator}
              isFollowing={isFollowing}
              isBlocked={isBlocked}
              isMuted={isMuted}
              hasFederation={hasActorRecord}
              profileShared={profileShared}
              onEdit={() => setShowEditDialog(true)}
              onFollow={handleFollow}
              onMessage={handleMessage}
              onSend={() => navigate(`/wallet?tab=send&to=${profile.username}`)}
              onTip={() => setShowTipDialog(true)}
              onGiftPremium={() => setShowGiftPremiumDialog(true)}
              onSubscribe={() => setShowSubscribeDialog(true)}
              onUnsubscribe={handleUnsubscribe}
              subscribed={!!activeSubscription}
              onShare={handleShareProfile}
              onMute={handleMute}
              onBlock={handleBlock}
              onFederation={() => {
                const handle = `@${profile.username}@testagram.site`;
                navigator.clipboard.writeText(handle).then(() => {
                  setFedHandleCopied(true);
                  setTimeout(() => setFedHandleCopied(false), 2000);
                });
              }}
            />
          </div>
'''
          transformed = transformed[:start] + action + transformed[end:]

          tabs = '      {/* Tabs */}'
          exactly(transformed, tabs)
          creator = '''      {isOwnProfile && profile && (
        <div className="px-4 mt-3">
          <ProfileCreatorTools userId={profile.id} />
        </div>
      )}

'''
          transformed = transformed.replace(tabs, creator + tabs, 1)

          exactly(transformed, '<ProfileCompactActions', 1)
          exactly(transformed, '<ProfileCreatorTools userId={profile.id} />', 1)
          exactly(transformed, 'onGiftPremium={() => setShowGiftPremiumDialog(true)}', 1)
          if transformed.count('ProfileCompactActions') != 2:
              raise SystemExit('ABORT: unexpected ProfileCompactActions count')
          if transformed.count('ProfileCreatorTools') != 2:
              raise SystemExit('ABORT: unexpected ProfileCreatorTools count')

          tmp = path.with_suffix('.tsx.tmp')
          tmp.write_text(transformed, encoding='utf-8')
          tmp.replace(path)
          print('Original SHA256:', original_hash)
          print('Transformed SHA256:', hashlib.sha256(transformed.encode()).hexdigest())
          PY

          git diff --check
          npm ci
          npm run build

          test "$(git diff --name-only)" = "src/pages/ProfilePage.tsx"
          ! git diff --name-only | grep -q '^\.github/workflows/'
          grep -q "import { ProfileCompactActions }" src/pages/ProfilePage.tsx
          grep -q "import { ProfileCreatorTools }" src/pages/ProfilePage.tsx
          test "$(grep -c '<ProfileCompactActions' src/pages/ProfilePage.tsx)" -eq 1
          test "$(grep -c '<ProfileCreatorTools userId={profile.id} />' src/pages/ProfilePage.tsx)" -eq 1

      - name: Commit only ProfilePage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ProfilePage.tsx
          test "$(git diff --cached --name-only)" = "src/pages/ProfilePage.tsx"
          git commit -m 'feat(profile): integrate compact actions and creator tools'
          git push origin HEAD:main
