name: ProfilePage Surgical Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-page-surgical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surgical-profile-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Surgical transform and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64;exec(base64.b64decode(''))"

          git diff --check
          npm ci
          npm run build

          changed_files="$(git diff --name-only)"
          test "$changed_files" = "src/pages/ProfilePage.tsx"
          if printf '%s\n' "$changed_files" | grep -q '^\.github/workflows/'; then
            echo 'ABORT: workflow files changed during surgical transform'
            exit 1
          fi
          grep -q "import { ProfileCompactActions }" src/pages/ProfilePage.tsx
          grep -q "import { ProfileCreatorTools }" src/pages/ProfilePage.tsx
          test "$(grep -c '<ProfileCompactActions' src/pages/ProfilePage.tsx)" -eq 1
          test "$(grep -c '<ProfileCreatorTools userId={profile.id} />' src/pages/ProfilePage.tsx)" -eq 1

      - name: Commit only ProfilePage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ProfilePage.tsx
          test "$(git diff --cached --name-only)" = "src/pages/ProfilePage.tsx"
          git commit -m 'feat(profile): integrate compact actions and creator tools'
          git push origin HEAD:main
