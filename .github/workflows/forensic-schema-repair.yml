name: Forensic schema repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch legacy schema assumptions
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # user_profiles is a read-only compatibility VIEW. The app must use
              # canonical public.profiles for both reads and writes.
              text = text.replace(".from('user_profiles')", ".from('profiles')")
              text = text.replace('.from("user_profiles")', '.from("profiles")')
              text = re.sub(r'(?<![A-Za-z0-9_])user_profiles(?=\s*\()', 'profiles', text)
              text = text.replace('user_profiles(*)', 'profiles(*)')
              text = text.replace('user_profiles!follows_', 'profiles!follows_')

              # Canonical profile counter is follower_count, not followers_count.
              text = text.replace('followers_count', 'follower_count')

              # Canonical post likes relation is post_likes, not likes.
              if path.name == 'ProfilePage.tsx':
                  text = text.replace(".from('likes')", ".from('post_likes')")
                  text = text.replace('.from("likes")', '.from("post_likes")')

                  # Normalize canonical profile fields once after the profile row is loaded.
                  text = text.replace(
                      'setProfile(profileData);',
                      "const socialLinks = (profileData.social_links ?? {}) as { twitter?: string | null; instagram?: string | null; linkedin?: string | null };\n      const normalizedProfile = { ...profileData, twitter_handle: socialLinks.twitter ?? null, instagram_handle: socialLinks.instagram ?? null, linkedin_url: socialLinks.linkedin ?? null, cover_image: profileData.cover_url ?? null, verified: profileData.verified_tier !== 'none' };\n      setProfile(normalizedProfile);",
                      1,
                  )

                  # Profile route may contain a stale username; fall back to the
                  # authenticated canonical UUID for the user's own profile.
                  old = "const { data: profileData, error: profileError } = await supabase.from('profiles').select('*').eq('username', username).single();\n      if (profileError) throw profileError;"
                  new = "const initialProfileQuery = username ? await supabase.from('profiles').select('*').eq('username', username).maybeSingle() : { data: null, error: null };\n      let profileData = initialProfileQuery.data;\n      if (!profileData && currentUser) {\n        const ownProfileQuery = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();\n        profileData = ownProfileQuery.data;\n      }\n      if (!profileData) throw initialProfileQuery.error ?? new Error('Canonical profile not found');"
                  text = text.replace(old, new, 1)

              # Notification rows use the canonical notification contract.
              text = re.sub(
                  r"\.from\((['\"])notifications\1\)\.insert\(\{\s*user_id:\s*([^,]+),\s*type:\s*([^,]+),\s*from_user_id:\s*([^}]+)\}\)",
                  r".from('notifications').insert({ recipient_id: \2, kind: \3, actor_id: \4 })",
                  text,
              )

              # creator_subscriptions stores amount, not price.
              if 'creator_subscriptions' in text:
                  text = re.sub(
                      r"(from\((['\"])creator_subscriptions\2\)\.upsert\(\{[^}]*?)\bprice:\s*price",
                      r"\1amount: price",
                      text,
                      flags=re.S,
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Patched files:', *changed, sep='\n- ')
          if not changed:
              print('No legacy schema patterns remained.')

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix(schema): align frontend with canonical Supabase schema"
          git push origin HEAD:main

      - name: Remove one-time repair workflow
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/forensic-schema-repair.yml ]; then
            git rm .github/workflows/forensic-schema-repair.yml
            git commit -m "chore(forensics): remove one-time schema repair workflow"
            git push origin HEAD:main
          fi
