name: Testagram CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ci/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck identity functions
        run: |
          deno check --no-config supabase/functions/identity-signup/index.ts
          deno check --no-config supabase/functions/identity-native-session/index.ts
          deno check --no-config supabase/functions/identity-native-webhook/index.ts
