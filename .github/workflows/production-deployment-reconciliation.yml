name: Production Deployment Reconciliation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact Git commit SHA to deploy and prove"
        required: false
        type: string

concurrency:
  group: production-deployment-reconciliation
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  MAX_DEPLOY_ATTEMPTS: "3"

jobs:
  reconcile-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve target SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="${{ github.event.inputs.target_sha || github.sha }}"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_sha must be a full SHA"; exit 1; }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact target revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Prove checkout SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@48.4.0

      - name: Pull production Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy and reconcile exact SHA
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "$MAX_DEPLOY_ATTEMPTS"); do
            echo "Deployment reconciliation attempt $attempt/$MAX_DEPLOY_ATTEMPTS"
            rm -f deployment-url.txt deployment-list.json health.txt

            # Build on Vercel with its production environment, then deploy.
            # This avoids prebuilt artifacts losing system/build environment variables.
            vercel deploy --prod --yes --force --token="$VERCEL_TOKEN" \
              --meta "githubDeployment=1" \
              --meta "githubCommitSha=$TARGET_SHA" \
              --meta "githubCommitRef=main" \
              --meta "githubCommitRepo=$REPO_NAME" \
              --meta "githubCommitOrg=$REPO_OWNER" \
              --meta "githubOrg=$REPO_OWNER" \
              --meta "githubRepo=$REPO_NAME" > deployment-url.txt

            # Vercel CLI emits Inspect/Production URLs plus progress/status lines.
            # Extract the canonical Production URL instead of assuming the final line is a URL.
            DEPLOY_URL="$(grep -E '^Production:[[:space:]]+https?://[^[:space:]]+' deployment-url.txt | tail -n 1 | sed -E 's/^Production:[[:space:]]+//; s/[[:space:]]+$//' || true)"
            # Fallback for CLI output that emits only a bare URL.
            if [[ -z "$DEPLOY_URL" ]]; then
              DEPLOY_URL="$(grep -Eo 'https?://[^[:space:]]+' deployment-url.txt | tail -n 1 | tr -d '\r' || true)"
            fi
            [[ "$DEPLOY_URL" =~ ^https?://[^[:space:]]+$ ]] || { echo "::warning::No canonical deployment URL found on attempt $attempt"; sleep 10; continue; }
            echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

            vercel inspect "$DEPLOY_URL" --wait --token="$VERCEL_TOKEN" > deployment-inspect.txt

            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20" \
              > deployment-list.json
            node scripts/verify-vercel-deployment.mjs

            # Probe the public production alias. The health contract is JSON: { "ok": true, ... }.
            # Keep the exact deployment URL probe too, so a healthy public alias cannot mask a bad deployment.
            for HEALTH_BASE_URL in "$DEPLOY_URL" "https://testagram.site"; do
              curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
                "$HEALTH_BASE_URL/api/health" > health.txt || {
                echo "::warning::Health probe failed for $HEALTH_BASE_URL on attempt $attempt"
                cat health.txt || true
                sleep 10
                continue 2
              }
              node -e 'const fs=require("node:fs"); const body=fs.readFileSync("health.txt","utf8").trim(); let payload; try { payload=JSON.parse(body); } catch (error) { console.error("Health endpoint did not return valid JSON:", error instanceof Error ? error.message : error); console.error(body); process.exit(1); } if (payload?.ok !== true || payload?.database !== "reachable") { console.error("Health contract failed:", JSON.stringify(payload)); process.exit(1); } console.log("Health contract passed:", JSON.stringify(payload));'
            done

            echo "Exact SHA, production READY state, deployment health, and public production health passed."
            exit 0
          done
          echo "::error::Production deployment reconciliation exhausted its 3-attempt circuit breaker."
          exit 1

      - name: Emit immutable gate evidence
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          # shellcheck disable=SC2129
          {
            echo "target_sha=$TARGET_SHA"
            echo "deployment_url=${{ steps.deploy.outputs.deployment_url }}"
            echo "gate=build-typecheck-lint-deploy-sha-ready-health"
            echo "status=passed"
          } >> "$GITHUB_STEP_SUMMARY"
