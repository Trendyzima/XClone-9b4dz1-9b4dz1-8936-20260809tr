                if supabase functions deploy "$name" --use-api --project-ref "$PROJECT_REF" --no-verify-jwt; then return 0; fi
              elif supabase functions deploy "$name" --use-api --project-ref "$PROJECT_REF"; then
                return 0
              fi
              if (( attempt >= max_attempts )); then
                echo "::error::Testagram Ads Edge Function deployment failed after $max_attempts attempts: $name"
                return 1
              fi
              delay=$((attempt * 20))
              echo "NOTICE:Supabase Ads deployment returned a transient failure for $name; retrying in ${delay}s (attempt $((attempt+1))/$max_attempts)."
              sleep "$delay"
              attempt=$((attempt+1))
            done
          }
          deploy_ads_function testagram-ad-campaign
          deploy_ads_function testagram-ads
          deploy_ads_function zenad-decision
          deploy_ads_function zenad-event "--no-verify-jwt"
          deploy_ads_function testagram-ad-asset-upload
          deploy_ads_function mpesa-ad-payment "--no-verify-jwt"
          # These two compatibility wrappers have no external imports. Deploy them with
