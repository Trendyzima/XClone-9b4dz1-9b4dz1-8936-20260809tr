      - name: Deploy Testagram authentication mail Edge Functions
        if: steps.supabase-auth.outputs.available == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ffrhglgkukgsuhxenena
        run: |
          set -euo pipefail
          PROJECT_REF="$SUPABASE_PROJECT_REF"
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is required to reconcile authentication mail functions."; exit 1; }
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Invalid Supabase project ref for authentication mail deployment."; exit 1; }

          secrets="$(supabase secrets list --project-ref "$PROJECT_REF")"
          for name in SEND_EMAIL_HOOK_SECRET IDENTITY_PREAUTH_SECRET IDENTITY_ENGINE_SECRET; do
            printf '%s\n' "$secrets" | grep -Eq "(^|[[:space:]|])$name([[:space:]|]|$)" || {
              echo "::error::$name is not configured in Supabase project secrets; refusing to deploy authentication functions."
              exit 1
            }
          done

          # The Edge Functions enqueue into the private mail_messages ledger using
          # Supabase's server-side credentials. The existing local SMTP worker drains
          # that queue. No public mail hostname, origin IP, or external gateway token.
          echo "Auth mail deployment preflight passed: local PostgreSQL queue contract is used.";

          deploy_auth_mail_function() {
            local name="$1"
            local attempt=1
            local max_attempts=4
            while true; do
              echo "Deploying authentication Edge Function $name (attempt $attempt/$max_attempts)"
              if supabase functions deploy "$name" --use-api --project-ref "$PROJECT_REF" --no-verify-jwt; then
                return 0
              fi
              if (( attempt >= max_attempts )); then
                echo "::error::Authentication Edge Function deployment failed after $max_attempts attempts: $name"
                return 1
              fi
              local delay=$((attempt * 20))
              echo "NOTICE: Auth function deployment failed transiently; retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt+1))
            done
          }

          # Reconcile all auth mail paths to the local Testagram PostgreSQL queue.
          # The mail ledger migration step above runs before this deployment step.
          deploy_auth_mail_function testagram-auth-email
          deploy_auth_mail_function testagram-magic-link
          deploy_auth_mail_function testagram-security-email
          deploy_auth_mail_function identity-signup
          echo "Testagram authentication Edge Functions deployed against the local mail queue."

