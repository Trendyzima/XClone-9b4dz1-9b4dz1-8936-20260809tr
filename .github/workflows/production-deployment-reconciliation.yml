name: Production Deployment Reconciliation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact Git commit SHA to deploy and prove"
        required: false
        type: string

concurrency:
  group: production-deployment-reconciliation
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  MAX_DEPLOY_ATTEMPTS: "3"

jobs:
  reconcile-production:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve target SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="${{ github.event.inputs.target_sha || github.sha }}"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_sha must be a full SHA"; exit 1; }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact target revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Prove checkout SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@48.4.0

      - name: Synchronize SMS secrets into Vercel production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SEND_SMS_HOOK_SECRETS: ${{ secrets.SEND_SMS_HOOK_SECRETS || secrets.SEND_SMS_HOOK_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SMS_RATE_LIMIT_SECRET: ${{ secrets.SMS_RATE_LIMIT_SECRET }}
          SMS_GATEWAY_URL: ${{ secrets.SMS_GATEWAY_URL || secrets.AFRICASTALKING_SMS_URL || vars.SMS_GATEWAY_URL }}
          SMS_GATEWAY_API_KEY: ${{ secrets.SMS_GATEWAY_API_KEY || secrets.AFRICASTALKING_API_KEY }}
          SMS_GATEWAY_USERNAME: ${{ secrets.SMS_GATEWAY_USERNAME || secrets.AFRICASTALKING_USERNAME || secrets.AFRICA_TALKING_USERNAME || secrets.AFRICAS_TALKING_USERNAME || secrets.AT_USERNAME || vars.SMS_GATEWAY_USERNAME || vars.AFRICASTALKING_USERNAME }}
          SMS_SENDER_NAME: ${{ secrets.SMS_SENDER_NAME || secrets.AFRICASTALKING_SENDER_ID || vars.SMS_SENDER_NAME || 'Testagram' }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Required GitHub secret/configuration is missing: $name"
              exit 1
            fi
            printf '::add-mask::%s\n' "$value"
          }

          put_production_secret() {
            local name="$1"
            local value="$2"
            require_secret "$name" "$value"
            printf '%s' "$value" | vercel env add "$name" production --force --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          }

          put_production_secret "SEND_SMS_HOOK_SECRETS" "$SEND_SMS_HOOK_SECRETS"
          put_production_secret "SUPABASE_URL" "$SUPABASE_URL"
          put_production_secret "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY"
          put_production_secret "SMS_RATE_LIMIT_SECRET" "$SMS_RATE_LIMIT_SECRET"
          put_production_secret "SMS_GATEWAY_URL" "$SMS_GATEWAY_URL"
          put_production_secret "SMS_GATEWAY_API_KEY" "$SMS_GATEWAY_API_KEY"
          put_production_secret "SMS_GATEWAY_USERNAME" "$SMS_GATEWAY_USERNAME"
          if [[ -n "$SMS_SENDER_NAME" ]]; then
            put_production_secret "SMS_SENDER_NAME" "$SMS_SENDER_NAME"
          else
            echo "SMS_SENDER_NAME not supplied; preserving provider/default sender configuration."
          fi

          echo "SMS production environment synchronized without printing secret values."

      - name: Synchronize Cloudflare R2 secrets into Vercel production
        shell: bash
        env:
          VERCEL_TOKEN: ${{secrets.VERCEL_TOKEN}}
          R2_ACCOUNT_ID: ${{secrets.R2_ACCOUNT_ID}}
          R2_ACCESS_KEY_ID: ${{secrets.R2_ACCESS_KEY_ID}}
          R2_SECRET_ACCESS_KEY: ${{secrets.R2_SECRET_ACCESS_KEY}}
          R2_MEDIA_BUCKET: ${{secrets.R2_MEDIA_BUCKET || vars.R2_MEDIA_BUCKET}}
          R2_PUBLIC_BASE_URL: ${{secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL}}
        run: |
          set -euo pipefail
          put_r2_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then echo "::error::Required R2 production configuration is missing: $name"; exit 1; fi
            printf "::add-mask::%s\n" "$value"
            printf "%s" "$value" | vercel env add "$name" production --force --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          }
          put_r2_secret "R2_ACCOUNT_ID" "$R2_ACCOUNT_ID"
          put_r2_secret "R2_ACCESS_KEY_ID" "$R2_ACCESS_KEY_ID"
          put_r2_secret "R2_SECRET_ACCESS_KEY" "$R2_SECRET_ACCESS_KEY"
          put_r2_secret "R2_MEDIA_BUCKET" "$R2_MEDIA_BUCKET"
          if [[ -n "$R2_PUBLIC_BASE_URL" ]]; then put_r2_secret "R2_PUBLIC_BASE_URL" "$R2_PUBLIC_BASE_URL"; fi
          printf "%s" "$APP_ORIGIN" | vercel env add "APP_ORIGIN" production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          echo "R2 production environment synchronized without printing secret values."

      - name: Pull production Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy and reconcile exact SHA
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "$MAX_DEPLOY_ATTEMPTS"); do
            echo "Deployment reconciliation attempt $attempt/$MAX_DEPLOY_ATTEMPTS"
            rm -f deployment-url.txt deployment-list.json health.txt

            # Build on Vercel with its production environment, then deploy.
            # This avoids prebuilt artifacts losing system/build environment variables.
            vercel deploy --prod --yes --force --token="$VERCEL_TOKEN" \
              --meta "githubDeployment=1" \
              --meta "githubCommitSha=$TARGET_SHA" \
              --meta "githubCommitRef=main" \
              --meta "githubCommitRepo=$REPO_NAME" \
              --meta "githubCommitOrg=$REPO_OWNER" \
              --meta "githubOrg=$REPO_OWNER" \
              --meta "githubRepo=$REPO_NAME" > deployment-url.txt

            # Vercel CLI emits Inspect/Production URLs plus progress/status lines.
            # Extract the canonical Production URL instead of assuming the final line is a URL.
            DEPLOY_URL="$(grep -E '^Production:[[:space:]]+https?://[^[:space:]]+' deployment-url.txt | tail -n 1 | sed -E 's/^Production:[[:space:]]+//; s/[[:space:]]+$//' || true)"
            # Fallback for CLI output that emits only a bare URL.
            if [[ -z "$DEPLOY_URL" ]]; then
              DEPLOY_URL="$(grep -Eo 'https?://[^[:space:]]+' deployment-url.txt | tail -n 1 | tr -d '\r' || true)"
            fi
            [[ "$DEPLOY_URL" =~ ^https?://[^[:space:]]+$ ]] || { echo "::warning::No canonical deployment URL found on attempt $attempt"; sleep 10; continue; }
            echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

            vercel inspect "$DEPLOY_URL" --wait --token="$VERCEL_TOKEN" > deployment-inspect.txt

            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20" \
              > deployment-list.json
            node scripts/verify-vercel-deployment.mjs

            # Probe the public production alias. Deployment-specific *.vercel.app URLs can redirect to
            # Vercel authentication pages in CI, so the public alias is the authoritative external smoke path.
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              "https://testagram.site/api/health" > health.txt || {
              echo "::warning::Public production health probe failed on attempt $attempt"
              cat health.txt || true
              sleep 10
              continue
            }
            node -e 'const fs=require("node:fs"); const body=fs.readFileSync("health.txt","utf8").trim(); let payload; try { payload=JSON.parse(body); } catch (error) { console.error("Health endpoint did not return valid JSON:", error instanceof Error ? error.message : error); console.error(body); process.exit(1); } if (payload?.ok !== true || payload?.database !== "reachable") { console.error("Health contract failed:", JSON.stringify(payload)); process.exit(1); } console.log("Health contract passed:", JSON.stringify(payload));'

            echo "Exact SHA, production READY state, and public production health passed."
            exit 0
          done
          echo "::error::Production deployment reconciliation exhausted its 3-attempt circuit breaker."
          exit 1

      - name: Emit immutable gate evidence
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          # shellcheck disable=SC2129
          {
            echo "target_sha=$TARGET_SHA"
            echo "deployment_url=${{ steps.deploy.outputs.deployment_url }}"
            echo "gate=build-typecheck-lint-deploy-sha-ready-health"
            echo "status=passed"
          } >> "$GITHUB_STEP_SUMMARY"
