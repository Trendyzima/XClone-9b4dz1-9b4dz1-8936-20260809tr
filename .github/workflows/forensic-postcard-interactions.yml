name: One-shot PostCard interaction migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[postcard-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate PostCard interactions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/features/PostCard.tsx';
          let s = fs.readFileSync(path, 'utf8');

          if (!s.includes("@/services/postInteractionService")) {
            s = s.replace(
              "import { updateInterestSignal } from '@/services/recommendations';",
              "import { updateInterestSignal } from '@/services/recommendations';\nimport { togglePostLike, togglePostRepost } from '@/services/postInteractionService';"
            );
          }

          const interactionEffect = /  useEffect\(\(\) => \{\n    if \(!user\) return;\n    const checkUserInteractions = async \(\) => \{[\s\S]*?    checkUserInteractions\(\);\n  \}, \[user, post\.id\]\);/;
          const interactionEffectReplacement = `  useEffect(() => {\n    if (!user) return;\n    const checkUserInteractions = async () => {\n      try {\n        const [{ data: likeData, error: likeError }, { data: repostData, error: repostError }] = await Promise.all([\n          supabase.from('post_likes').select('id').eq('user_id', user.id).eq('post_id', post.id).maybeSingle(),\n          supabase.from('post_reposts').select('id').eq('user_id', user.id).eq('post_id', post.id).maybeSingle(),\n        ]);\n        if (likeError) throw likeError;\n        if (repostError) throw repostError;\n        setIsLiked(!!likeData);\n        setIsReposted(!!repostData);\n      } catch (error) {\n        console.error('Error checking user interactions:', error);\n      }\n    };\n    checkUserInteractions();\n  }, [user, post.id]);`;
          if (!interactionEffect.test(s)) throw new Error('interaction state block not found');
          s = s.replace(interactionEffect, interactionEffectReplacement);

          const likeBlock = /  const handleLike = async \(e: React\.MouseEvent\) => \{[\s\S]*?\n  \};\n\n  const handleRepost/;
          const likeReplacement = `  const handleLike = async (e: React.MouseEvent) => {\n    e.stopPropagation();\n    if (!user) { navigate('/auth'); return; }\n    const previousIsLiked = isLiked;\n    const previousLikesCount = likesCount;\n    const optimisticIsLiked = !previousIsLiked;\n    setIsLiked(optimisticIsLiked);\n    try {\n      const state = await togglePostLike(post.id);\n      setIsLiked(state.is_liked);\n      setLikesCount(state.likes_count);\n      if (state.is_liked) {\n        if (post.user_id !== user.id) {\n          await supabase.from('notifications').insert({ user_id: post.user_id, type: 'like', from_user_id: user.id, post_id: post.id });\n          sendActivityNotification({ recipientUserId: post.user_id, title: 'New Like', body: \`${'${'}user.username} liked your post\`, data: { route: \`/post/${'${'}post.id}\`, type: 'like' } });\n        }\n        updateInterestSignal(user.id, post.id, 'like').catch(() => {});\n      }\n      onUpdate?.();\n    } catch (error) {\n      console.error('Like error:', error);\n      setIsLiked(previousIsLiked);\n      setLikesCount(previousLikesCount);\n      toast({ title: 'Error', description: error instanceof Error ? error.message : 'Failed to like post', variant: 'destructive' });\n    }\n  };\n\n  const handleRepost`;
          if (!likeBlock.test(s)) throw new Error('like block not found');
          s = s.replace(likeBlock, likeReplacement);

          const repostBlock = /  const handleRepost = async \(e: React\.MouseEvent\) => \{[\s\S]*?\n  \};\n\n  const handleNativeShare/;
          const repostReplacement = `  const handleRepost = async (e: React.MouseEvent) => {\n    e.stopPropagation();\n    if (!user) { navigate('/auth'); return; }\n    const previousIsReposted = isReposted;\n    const previousRepostsCount = repostsCount;\n    const optimisticIsReposted = !previousIsReposted;\n    setIsReposted(optimisticIsReposted);\n    try {\n      const state = await togglePostRepost(post.id);\n      setIsReposted(state.is_reposted);\n      setRepostsCount(state.reposts_count);\n      if (state.is_reposted) {\n        if (post.user_id !== user.id) {\n          await supabase.from('notifications').insert({ user_id: post.user_id, type: 'repost', from_user_id: user.id, post_id: post.id });\n          sendActivityNotification({ recipientUserId: post.user_id, title: 'New Repost', body: \`${'${'}user.username} reposted your post\`, data: { route: \`/post/${'${'}post.id}\`, type: 'repost' } });\n        }\n        toast({ title: 'Reposted successfully' });\n        updateInterestSignal(user.id, post.id, 'repost').catch(() => {});\n      } else {\n        toast({ title: 'Repost removed' });\n      }\n      onUpdate?.();\n    } catch (error) {\n      console.error('Repost error:', error);\n      setIsReposted(previousIsReposted);\n      setRepostsCount(previousRepostsCount);\n      toast({ title: 'Error', description: error instanceof Error ? error.message : 'Failed to repost', variant: 'destructive' });\n    }\n  };\n\n  const handleNativeShare`;
          if (!repostBlock.test(s)) throw new Error('repost block not found');
          s = s.replace(repostBlock, repostReplacement);

          // Migrate every ❤️ reaction transition through the canonical like RPC.
          const reactionBlock = /    if \(prevReaction === emoji\) \{[\s\S]*?    \}\n    onUpdate\?\.\(\);\n  \};/;
          const reactionReplacement = `    if (prevReaction === emoji) {\n      setUserReaction(null);\n      setReactionEmojis(prev => {\n        const idx = prev.indexOf(emoji);\n        if (idx < 0) return prev;\n        const next = [...prev];\n        const nextNums = [...reactionNums];\n        nextNums[idx] = Math.max(0, (nextNums[idx] ?? 1) - 1);\n        if (nextNums[idx] === 0) { next.splice(idx, 1); nextNums.splice(idx, 1); }\n        setReactionNums(nextNums);\n        return next;\n      });\n      await supabase.from('post_reactions').delete().eq('post_id', post.id).eq('user_id', user.id);\n      if (emoji === '❤️' && isLiked) {\n        const state = await togglePostLike(post.id);\n        setIsLiked(state.is_liked);\n        setLikesCount(state.likes_count);\n      }\n    } else {\n      setUserReaction(emoji);\n      setReactionEmojis(prev => {\n        const nextEmojis = [...prev];\n        const nextNums = [...reactionNums];\n        if (prevReaction) {\n          const pi = nextEmojis.indexOf(prevReaction);\n          if (pi >= 0) {\n            nextNums[pi] = Math.max(0, (nextNums[pi] ?? 1) - 1);\n            if (nextNums[pi] === 0) { nextEmojis.splice(pi, 1); nextNums.splice(pi, 1); }\n          }\n        }\n        const ei = nextEmojis.indexOf(emoji);\n        if (ei >= 0) nextNums[ei]++;\n        else { nextEmojis.push(emoji); nextNums.push(1); }\n        setReactionNums(nextNums);\n        return nextEmojis;\n      });\n      await supabase.from('post_reactions').upsert(\n        { post_id: post.id, user_id: user.id, emoji },\n        { onConflict: 'post_id,user_id' }\n      );\n      if (emoji === '❤️' && !isLiked) {\n        const state = await togglePostLike(post.id);\n        setIsLiked(state.is_liked);\n        setLikesCount(state.likes_count);\n        if (state.is_liked && post.user_id !== user.id) {\n          await supabase.from('notifications').insert({ user_id: post.user_id, type: 'like', from_user_id: user.id, post_id: post.id });\n          sendActivityNotification({ recipientUserId: post.user_id, title: 'New Reaction', body: \`${'${'}user.username} reacted ❤️ to your post\`, data: { route: \`/post/${'${'}post.id}\`, type: 'like' } });\n        }\n      } else if (prevReaction === '❤️' && emoji !== '❤️' && isLiked) {\n        const state = await togglePostLike(post.id);\n        setIsLiked(state.is_liked);\n        setLikesCount(state.likes_count);\n      }\n    }\n    onUpdate?.();\n  };`;
          if (!reactionBlock.test(s)) throw new Error('reaction block not found');
          s = s.replace(reactionBlock, reactionReplacement);

          const legacy = (s.match(/supabase\.from\(['\"](?:likes|reposts)['\"]\)|supabase\.from\(['\"]posts['\"]\)\.update\(\{\s*(?:likes_count|reposts_count)/g) || []).length;
          if (legacy !== 0) throw new Error('legacy interaction calls remain: ' + legacy);

          fs.writeFileSync(path, s);
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/features/PostCard.tsx
          git diff --cached --check
          git commit -m "fix: migrate PostCard interactions to canonical RPCs [postcard-migration]"
          git push
