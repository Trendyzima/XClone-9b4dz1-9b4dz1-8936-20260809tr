name: Cloudflare Heartbeat Edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/heartbeat-worker/**"
      - "supabase/functions/heartbeat/**"
      - "supabase/migrations/20260919093000_user_heartbeat_lease.sql"
      - "supabase/migrations/20260919093500_user_heartbeat_lease_window.sql"
      - "src/services/heartbeatClient.ts"
      - ".github/workflows/cloudflare-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-heartbeat
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy heartbeat edge
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pinned Wrangler
        working-directory: cloudflare/heartbeat-worker
        run: npm install --no-save wrangler@4.135.0

      - name: Validate Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions production secret CLOUDFLARE_API_TOKEN. Wrangler cannot authenticate without a Cloudflare API token."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing GitHub Actions production secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          printf "::add-mask::%s\\n" "$CLOUDFLARE_API_TOKEN"
          echo "Cloudflare deployment credentials are present (values masked)."

      - name: Validate Worker configuration
        working-directory: cloudflare/heartbeat-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Deploy Cloudflare Worker
        working-directory: cloudflare/heartbeat-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Emit non-secret deployment receipt
        if: ${{ success() }}
        run: echo "Cloudflare heartbeat Worker deployed; secret values were never printed."
