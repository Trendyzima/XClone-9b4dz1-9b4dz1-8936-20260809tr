name: Temporary Notifications Canonical Migration
on:
  push:
    branches: [main]
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate notification consumers
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/NotificationsPage.tsx')
          s = p.read_text()
          s = s.replace("import { useFediversePolling } from '@/hooks/useFediversePolling';", "import { useFediversePolling } from '@/hooks/useFediversePolling';\nimport { backendCapabilities } from '@/services/testagramCapabilityClient';")
          old = '''  const fetchNotifications = async (pageNum = 0) => {\n    if (!user) return;\n    setLoading(true);\n    try {\n      let query = supabase\n        .from('notifications')\n        .select('*, from_user:user_profiles!notifications_from_user_id_fkey(*), post:posts(*)')\n        .eq('user_id', user.id)\n        .order('created_at', { ascending: false })\n        .range(pageNum * PAGE_SIZE, (pageNum + 1) * PAGE_SIZE - 1);\n\n      if (activeTab === 'mentions') {\n        query = query.eq('type', 'mention');\n      } else if (activeTab === 'payments') {\n        query = query.in('type', [\n          'payment_success', 'payment_sent', 'payment_failed',\n          'payout_sent', 'deposit_confirmed', 'boost_activated',\n        ]);\n      }\n\n      const { data, error } = await query;\n      if (error) throw error;\n\n      if (pageNum === 0) setNotifications(data ?? []);\n      else setNotifications(prev => [...prev, ...(data ?? [])]);\n      setPage(pageNum);\n    } catch (err) {\n      console.error('[notifications] fetch error:', err);\n    } finally {\n      setLoading(false);\n    }\n  };'''
          new = '''  const fetchNotifications = async (pageNum = 0) => {\n    if (!user) return;\n    setLoading(true);\n    try {\n      const kind = activeTab === 'mentions' ? 'mention' : undefined;\n      const page = await backendCapabilities.listNotifications(PAGE_SIZE, String(pageNum * PAGE_SIZE), { kind });\n      const items = page.items.map((n) => ({\n        ...n,\n        type: n.kind,\n        read: Boolean(n.read_at),\n        metadata: n.data ?? {},\n        from_user: n.actor ? { username: n.actor.username, display_name: n.actor.display_name, avatar_url: n.actor.avatar_url } : null,\n        post: null,\n      }));\n      const filtered = activeTab === 'payments'\n        ? items.filter((n) => ['payment_success','payment_sent','payment_failed','payout_sent','deposit_confirmed','boost_activated'].includes(n.type))\n        : items;\n      if (pageNum === 0) setNotifications(filtered);\n      else setNotifications(prev => [...prev, ...filtered]);\n      setPage(pageNum);\n    } catch (err) {\n      console.error('[notifications] canonical fetch error:', err);\n    } finally {\n      setLoading(false);\n    }\n  };'''
          if old not in s: raise SystemExit('Notifications fetch block not found')
          s = s.replace(old, new)
          old2 = '''  const markAsRead = async () => {\n    if (!user) return;\n    await supabase\n      .from('notifications')\n      .update({ read: true })\n      .eq('user_id', user.id)\n      .eq('read', false);\n  };\n\n  const markAllAsRead = async () => {\n    if (!user) return;\n    await supabase\n      .from('notifications')\n      .update({ read: true })\n      .eq('user_id', user.id)\n      .eq('read', false);\n    setNotifications(prev => prev.map(n => ({ ...n, read: true })));\n  };'''
          new2 = '''  const markAsRead = async () => {\n    if (!user) return;\n    await backendCapabilities.markAllNotificationsRead();\n    setNotifications(prev => prev.map(n => ({ ...n, read: true })));\n  };\n\n  const markAllAsRead = async () => {\n    if (!user) return;\n    await backendCapabilities.markAllNotificationsRead();\n    setNotifications(prev => prev.map(n => ({ ...n, read: true })));\n  };'''
          if old2 not in s: raise SystemExit('Notifications mark-read block not found')
          s = s.replace(old2, new2)
          marker = '''  const loadMore = async (): Promise<boolean> => {'''
          realtime = '''  useEffect(() => {\n    if (!user || activeTab === 'fediverse') return;\n    const channel = supabase\n      .channel(`testagram-notifications-${user.id}`)\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `recipient_id=eq.${user.id}` }, (payload) => {\n        const n = payload.new as any;\n        setNotifications(prev => [{\n          ...n,\n          type: n.kind,\n          read: false,\n          metadata: n.data ?? {},\n          from_user: null,\n          post: null,\n        }, ...prev.filter((item) => item.id !== n.id)]);\n      })\n      .subscribe();\n    return () => { void supabase.removeChannel(channel); };\n  }, [user, activeTab]);\n\n'''
          if marker not in s: raise SystemExit('Notifications loadMore marker not found')
          s = s.replace(marker, realtime + marker, 1)
          p.write_text(s)

          p = Path('src/pages/NotificationPreferencesPage.tsx')
          s = p.read_text()
          s = s.replace("import { PageAdBanner } from '@/components/features/AdSenseAd';", "import { PageAdBanner } from '@/components/features/AdSenseAd';\nimport { backendCapabilities } from '@/services/testagramCapabilityClient';")
          old = '''      const { data } = await supabase\n        .from('notification_preferences')\n        .select('*')\n        .eq('user_id', user.id);\n      const map: Record<string, NotifPref> = {};'''
          new = '''      const { items } = await backendCapabilities.listNotificationPreferences();\n      const data = items;\n      const map: Record<string, NotifPref> = {};'''
          if old not in s: raise SystemExit('Preference read block not found')
          s = s.replace(old, new)
          old = '''    const { error } = await supabase.from('notification_preferences').upsert({\n      user_id: user.id, notif_type: type,\n      in_app: updated.in_app, push: updated.push, email: updated.email,\n      updated_at: new Date().toISOString(),\n    }, { onConflict: 'user_id,notif_type' });'''
          new = '''    let error: Error | null = null;\n    try {\n      await backendCapabilities.upsertNotificationPreference({\n        notif_type: type, in_app: updated.in_app, push: updated.push, email: updated.email,\n      });\n    } catch (err) {\n      error = err instanceof Error ? err : new Error('Failed to save preference');\n    }'''
          if old not in s: raise SystemExit('Preference upsert block not found')
          s = s.replace(old, new)
          old = '''    const { error } = await supabase.from('notification_preferences').upsert(rows, { onConflict: 'user_id,notif_type' });\n    setSaving('');'''
          new = '''    let error: Error | null = null;\n    try {\n      for (const row of rows) {\n        await backendCapabilities.upsertNotificationPreference({\n          notif_type: row.notif_type, in_app: row.in_app, push: row.push, email: row.email,\n        });\n      }\n    } catch (err) {\n      error = err instanceof Error ? err : new Error('Failed to save preferences');\n    }\n    setSaving('');'''
          if old not in s: raise SystemExit('Preference save-all block not found')
          s = s.replace(old, new)
          p.write_text(s)

          Path('.github/workflows/notifications-canonical-migration.yml').unlink()
      - name: Commit canonical notification migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/NotificationsPage.tsx src/pages/NotificationPreferencesPage.tsx .github/workflows/notifications-canonical-migration.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: route notification UI through capability plane"
          git push
