name: Profile features upper-right surgical fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch profile feature control
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/ProfilePage.tsx')
          s = p.read_text()
          old = '''<button onClick={() => navigate('/profile-features')} className="inline-flex items-center gap-1.5 px-3.5 py-2 border border-primary/20 bg-primary/5 text-primary rounded-full font-semibold text-sm hover:bg-primary/10 transition-colors">\n          <Sparkles className="w-3.5 h-3.5" />More features\n        </button>'''
          new = '''<button onClick={() => navigate('/profile-features')} aria-label="Profile features" title="Profile features" className="ml-auto inline-flex items-center gap-1.5 px-3 py-2 border border-primary/30 bg-primary/10 text-primary rounded-full font-semibold text-sm hover:bg-primary/15 transition-colors shadow-sm">\n                    <Sparkles className="w-3.5 h-3.5" />\n                    <span className="hidden sm:inline">Features</span>\n                  </button>'''
          if old not in s:
              raise SystemExit('Expected profile feature button was not found; refusing to patch.')
          p.write_text(s.replace(old, new, 1))
      - name: Verify source
        run: |
          grep -q 'aria-label="Profile features"' src/pages/ProfilePage.tsx
          grep -q 'ml-auto inline-flex' src/pages/ProfilePage.tsx
          grep -q "navigate('/profile-features')" src/pages/ProfilePage.tsx
      - name: Typecheck lint build
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ProfilePage.tsx
          git commit -m 'fix(profile): place feature control in upper-right' || exit 0
          git push origin main
          git rm .github/workflows/profile-features-upper-right.yml
          git commit -m 'chore: remove one-time profile feature patch workflow'
          git push origin main
