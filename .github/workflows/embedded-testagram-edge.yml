name: Embedded Testagram Edge CDN

on:
  push:
    branches: [main]
    paths:
      - "services/testagram-edge/**"
      - ".github/workflows/embedded-testagram-edge.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/testagram-edge/**"
      - ".github/workflows/embedded-testagram-edge.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/testagram-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/testagram-edge/go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - name: Build embedded edge image
        working-directory: .
        run: docker build -f services/testagram-edge/Dockerfile -t testagram-edge:${{ github.sha }} .
