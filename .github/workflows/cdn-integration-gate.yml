name: Testagram Virtual CDN Integration Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-cdn-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/testagram-cdn/go.mod
          cache-dependency-path: services/testagram-cdn/go.sum
      - name: Verify browser virtual CDN contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const CACHE_NAME = 'testagram-virtual-cdn-v1'" src/services/virtualCdnLoader.ts
          grep -F 'const LIVE_SEGMENT_TTL_MS = 20_000' src/services/virtualCdnLoader.ts
          grep -F 'const MAX_CACHED_SEGMENTS = 180' src/services/virtualCdnLoader.ts
          grep -F "import VirtualCdnLoader from '@/services/virtualCdnLoader'" src/components/features/TvChannelPlayer.tsx
          grep -F 'loader:VirtualCdnLoader as any' src/components/features/TvChannelPlayer.tsx
          grep -F 'const playbackUrl=proxyFallbackRef.current?proxyUrl():directUrl;' src/components/features/TvChannelPlayer.tsx
          if grep -F 'tv-cdn-playback' src/components/features/TvChannelPlayer.tsx; then
            echo 'TV playback must not call a hosted CDN authorization function.' >&2
            exit 1
          fi
          if grep -F 'runs-on: [self-hosted' .github/workflows/deploy-testagram-cdn.yml; then
            echo 'A self-hosted CDN deployment must not be required.' >&2
            exit 1
          fi
      - name: Test legacy Go code without deployment
        working-directory: services/testagram-cdn
        run: go test ./...
      - name: Build XClone
        run: |
          npm ci
          npm run build
