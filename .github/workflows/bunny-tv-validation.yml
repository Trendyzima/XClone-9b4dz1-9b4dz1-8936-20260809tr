name: Bunny TV migration validation

on:
  pull_request:
    paths:
      - "src/**"
      - "api/**"
      - "supabase/functions/tv-media-control/**"
      - "supabase/functions/_shared/firebase-firestore.ts"
      - "supabase/migrations/**"
      - "firestore.rules"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/bunny-tv-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Assert obsolete TV transports are not active in runtime code
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE "YOUTUBE_(CLIENT|REFRESH|STREAM)|youtube-encoder-config|cloudflarestream\.com|tv_provider.{0,20}(youtube|cloudflare)"             src/pages/TvStudioPage.tsx src/pages/TvPublicLivePage.tsx src/pages/LiveStreamPage.tsx             api/live.ts supabase/functions/tv-media-control/index.ts supabase/functions/_shared             || { echo "Obsolete YouTube/Cloudflare TV runtime reference found"; exit 1; }
