name: Forensic notification and tip repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime contracts
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/ProfilePage.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace("order('amount', { ascending: false })", "order('amount_cents', { ascending: false })")
          s=s.replace(".or(`from_user_id.eq.${userId},to_user_id.eq.${userId}`)", ".or(`sender_id.eq.${userId},recipient_id.eq.${userId}`)")
          s=s.replace("t.to_user_id", "t.recipient_id")
          p.write_text(s,encoding='utf-8')

          p=Path('src/pages/NotificationsPage.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const options = activeTab === 'mentions' ? { kind: 'mention' } : {};", "const options = {};" )
          old="const visible = activeTab === 'payments' ? normalized.filter((n) => isPaymentType(n.type)) : normalized;"
          new="const visible = activeTab === 'mentions' ? normalized.filter((n) => n.type === 'mention') : activeTab === 'payments' ? normalized.filter((n) => isPaymentType(n.type)) : normalized;"
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/ProfilePage.tsx src/pages/NotificationsPage.tsx
          git commit -m 'fix(runtime): correct tip schema and notification tab filtering'
          git push origin HEAD:main
      - name: Remove one-shot workflow
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/forensic-notification-tip-repair.yml
          git commit -m 'chore(forensics): remove notification tip repair workflow'
          git push origin HEAD:main
