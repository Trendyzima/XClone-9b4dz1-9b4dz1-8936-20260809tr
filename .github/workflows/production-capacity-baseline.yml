name: Production Capacity Baseline

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production Deployment Reconciliation"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-capacity-baseline
  cancel-in-progress: false

jobs:
  baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PUBLIC_PRODUCTION_ORIGIN: "https://testagram.site"
      BASELINE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      LOAD_REQUESTS: "2000"
      LOAD_CONCURRENCY: "100"
      DEPLOY_WAIT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="$BASELINE_SHA"
          test "$actual" = "$expected"
          echo "Verified source SHA: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for exact production revision
        run: node scripts/production-capacity-baseline.mjs --wait-for-deployment

      - name: Run production capacity baseline
        run: node scripts/production-capacity-baseline.mjs
