name: Deploy Identity Verification Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/identity-signup/**'
      - 'supabase/functions/didit-identity-webhook/**'
      - '.github/workflows/deploy-identity-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-identity-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy identity-first onboarding functions
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ffrhglgkukgsuhxenena
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test "${SUPABASE_PROJECT_ID}" = "ffrhglgkukgsuhxenena"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      # Runtime identity secrets live in Supabase, not GitHub Actions.
      # GitHub never receives or copies Didit credentials.
      - name: Verify Supabase identity secret names
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(supabase secrets list --project-ref "${SUPABASE_PROJECT_ID}")"
          printf '%s\n' "$secrets"
          for name in DIDIT_API_KEY DIDIT_WEBHOOK_SECRET DIDIT_WORKFLOW_ID IDENTITY_PREAUTH_SECRET; do
            printf '%s\n' "$secrets" | grep -Eq "(^|[[:space:]|])$name([[:space:]|]|$)" || {
              echo "::error::$name is not configured in Supabase project secrets."
              exit 1
            }
          done
          echo "Required Didit identity secret names are present in Supabase; values were not read or printed."

      - name: Deploy identity signup
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy identity-signup             --project-ref "${SUPABASE_PROJECT_ID}"             --no-verify-jwt

      - name: Deploy Didit webhook
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy didit-identity-webhook             --project-ref "${SUPABASE_PROJECT_ID}"             --no-verify-jwt

      - name: Verify deployed functions exist
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "${SUPABASE_PROJECT_ID}"
