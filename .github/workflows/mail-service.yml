name: Testagram Mail Service CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/mail/**'
      - 'supabase/migrations/**testagram_owned_mail.sql'
      - 'supabase/migrations/**auth_magic_link_rate_limit.sql'
      - 'supabase/functions/testagram-auth-email/**'
      - 'supabase/functions/testagram-magic-link/**'
      - 'supabase/functions/testagram-security-email/**'
      - 'api/email/send.ts'
      - '.github/workflows/mail-service.yml'
      - '.github/workflows/production-deployment-reconciliation.yml'
  push:
    branches: [main, "ci/**"]
    paths:
      - 'services/mail/**'
      - 'supabase/migrations/**testagram_owned_mail.sql'
      - 'supabase/migrations/**auth_magic_link_rate_limit.sql'
      - 'supabase/functions/testagram-auth-email/**'
      - 'supabase/functions/testagram-magic-link/**'
      - 'supabase/functions/testagram-security-email/**'
      - 'api/email/send.ts'
      - '.github/workflows/mail-service.yml'
      - '.github/workflows/production-deployment-reconciliation.yml'

permissions:
  contents: read

jobs:
  mail-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/mail/package.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test compiled service
        run: |
          TESTAGRAM_MAIL_TOKEN=ci-token           SUPABASE_URL=https://example.invalid           SUPABASE_SECRET_KEY=ci-secret           node dist/index.js >/tmp/testagram-mail.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          attempt=0
          while [ "$attempt" -lt 20 ]; do
            attempt=$((attempt + 1))
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/testagram-mail.log
          exit 1

      - name: Verify production Testagram Mail readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 25 \
            https://mail.testagram.site/ready > /tmp/testagram-mail-ready.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const readiness = JSON.parse(fs.readFileSync("/tmp/testagram-mail-ready.json", "utf8"));
          if (readiness?.ok !== true || readiness?.ready !== true || readiness?.service !== "testagram-mail") {
            throw new Error("Production Testagram Mail is not ready: " + JSON.stringify(readiness));
          }
          console.log("Production Testagram Mail readiness passed.");
          NODE
