name: Profile feature persistence surgical wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ProfilePage
        shell: python
        run: |
          from pathlib import Path
          profile = Path('src/pages/ProfilePage.tsx')
          text = profile.read_text()
          anchor = "  if (!profile) return null;\n"
          helper = "  if (!profile) return null;\n  const profileFeatureSettings = { analytics: true, monetization: true, podcasts: true, series: true, achievements: true, highlights: true, 'social-links': true, tips: true, ...(profile.profile_features ?? {}) };\n  const featureEnabled = (key: string) => profileFeatureSettings[key as keyof typeof profileFeatureSettings] !== false;\n"
          if "const profileFeatureSettings =" not in text:
              if anchor not in text: raise SystemExit('profile null anchor not found')
              text = text.replace(anchor, helper, 1)
          replacements = [
              ("          {profileAchievementsUnlocked.length > 0 && (", "          {featureEnabled('achievements') && profileAchievementsUnlocked.length > 0 && ("),
              ("          {profile && (\n            <StoryHighlights profileUserId={profile.id} isOwnProfile={isOwnProfile} />", "          {featureEnabled('highlights') && profile && (\n            <StoryHighlights profileUserId={profile.id} isOwnProfile={isOwnProfile} />"),
              ("          {(highlights.length > 0 || isOwnProfile) && (\n            <div className=\"flex items-start gap-4 py-3 overflow-x-auto scrollbar-hide\">", "          {featureEnabled('highlights') && (highlights.length > 0 || isOwnProfile) && (\n            <div className=\"flex items-start gap-4 py-3 overflow-x-auto scrollbar-hide\">"),
              ("          {(profile.twitter_handle || profile.instagram_handle || profile.linkedin_url || isOwnProfile) && (", "          {featureEnabled('social-links') && (profile.twitter_handle || profile.instagram_handle || profile.linkedin_url || isOwnProfile) && ("),
              ("      {isOwnProfile && <div className=\"px-4 mt-4\"><RevenueAnalyticsWidget /></div>}\n      {isOwnProfile && profile && <div className=\"px-4 mt-4\"><CreatorMonetizationHub userId={profile.id} /></div>}", "      {featureEnabled('analytics') && isOwnProfile && <div className=\"px-4 mt-4\"><RevenueAnalyticsWidget /></div>}\n      {featureEnabled('monetization') && isOwnProfile && profile && <div className=\"px-4 mt-4\"><CreatorMonetizationHub userId={profile.id} /></div>}"),
              ("  const tabs = isOwnProfile\n    ? ['Posts', 'Threads', 'Replies', 'Media', 'Videos', 'Podcasts', 'Series', 'Likes', 'Tips', 'Gifts', 'Followers', 'Following', 'Analytics']\n    : ['Posts', 'Threads', 'Replies', 'Media', 'Videos', 'Podcasts', 'Series', 'Likes', 'Tips', 'Gifts', 'Followers', 'Following'];", "  const tabs = (isOwnProfile\n    ? ['Posts', 'Threads', 'Replies', 'Media', 'Videos', 'Podcasts', 'Series', 'Likes', 'Tips', 'Gifts', 'Followers', 'Following', 'Analytics']\n    : ['Posts', 'Threads', 'Replies', 'Media', 'Videos', 'Podcasts', 'Series', 'Likes', 'Tips', 'Gifts', 'Followers', 'Following'])\n    .filter(tab => tab !== 'Podcasts' || featureEnabled('podcasts'))\n    .filter(tab => tab !== 'Series' || featureEnabled('series'))\n    .filter(tab => tab !== 'Tips' || featureEnabled('tips'))\n    .filter(tab => tab !== 'Analytics' || featureEnabled('analytics'));"),
              ("        {activeTab === 'Podcasts' && (", "        {featureEnabled('podcasts') && activeTab === 'Podcasts' && ("),
              ("        {activeTab === 'Series' && (", "        {featureEnabled('series') && activeTab === 'Series' && ("),
              ("        {activeTab === 'Tips' && (", "        {featureEnabled('tips') && activeTab === 'Tips' && ("),
              ("          {(tipGoal !== null || isOwnProfile) && (", "          {featureEnabled('tips') && (tipGoal !== null || isOwnProfile) && ("),
          ]
          for old, new in replacements:
              if old not in text: raise SystemExit('missing profile anchor: ' + old[:70])
              text = text.replace(old, new, 1)
          profile.write_text(text)

      - name: Verify source
        run: |
          test -f supabase/migrations/20260917130000_profile_feature_settings.sql
          grep -q "profile_features" src/pages/ProfileFeaturesPage.tsx
          grep -q "const profileFeatureSettings" src/pages/ProfilePage.tsx
          grep -q "featureEnabled('analytics')" src/pages/ProfilePage.tsx
          grep -q "featureEnabled('podcasts')" src/pages/ProfilePage.tsx
          grep -q "featureEnabled('tips')" src/pages/ProfilePage.tsx

      - name: Typecheck lint build
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run build

      - name: Commit and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/profile-feature-persistence-surgical.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ProfilePage.tsx .github/workflows/profile-feature-persistence-surgical.yml
          git commit -m 'feat(profile): enforce canonical feature visibility'
          git push origin HEAD:main
