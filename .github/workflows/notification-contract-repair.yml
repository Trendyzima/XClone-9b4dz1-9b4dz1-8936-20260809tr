name: Notification Contract Repair
on:
  push:
    branches: [main]
    paths:
      - 'src/pages/NotificationsPage.tsx'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair notification fetch return contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='src/pages/NotificationsPage.tsx';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('const fetchNotifications = async (cursorValue?: string | null, replace = true) => {','const fetchNotifications = async (cursorValue?: string | null, replace = true): Promise<boolean> => {');
          if (s.includes('setHasMore(Boolean(result.next_cursor));') && !s.includes('setHasMore(Boolean(result.next_cursor));\n      return Boolean(result.next_cursor);')) {
            s=s.replace('setHasMore(Boolean(result.next_cursor));','setHasMore(Boolean(result.next_cursor));\n      return Boolean(result.next_cursor);');
          }
          const paymentDecl="  const isPaymentType = (type: string) =>\n    ['payment_success', 'payment_sent', 'payment_failed', 'payout_sent', 'deposit_confirmed', 'boost_activated', 'ad_active', 'ad_rejected', 'new_ad'].includes(type);\n";
          const first=s.indexOf(paymentDecl), second=first<0?-1:s.indexOf(paymentDecl,first+paymentDecl.length);
          if(second>=0) s=s.slice(0,second)+s.slice(second+paymentDecl.length);
          s=s.replace('await fetchNotifications(cursorValue, false);\n    return hasMore;','return fetchNotifications(cursorValue, false);');
          fs.writeFileSync(p,s);
          const forbidden=[".from('notifications')",'.from("notifications")','.update({ read: true })',".eq('user_id', user.id)",'notifications_from_user_id_fkey'];
          const legacy=forbidden.filter(x=>s.includes(x));
          if(legacy.length) throw new Error('Legacy notification contract remains: '+legacy.join(', '));
          for(const x of ['backendCapabilities.listNotifications','backendCapabilities.getUnreadNotificationCount','backendCapabilities.markNotificationRead','backendCapabilities.markAllNotificationsRead','recipient_id=eq.']) if(!s.includes(x)) throw new Error('Missing canonical contract: '+x);
          NODE
      - name: Commit repaired notification page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/NotificationsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete canonical notification pagination contract"
          git push origin HEAD:main
