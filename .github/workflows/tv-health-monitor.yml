name: TV Channel Health Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tv-health-monitor.yml'
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tv-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    name: Probe worldwide TV channels
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build worldwide TV catalogue
        run: node scripts/build-tv-catalog.mjs

      - name: Request GitHub OIDC token
        id: oidc
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          node <<'NODE'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=testagram-tv-health';
            const response = await fetch(url, {
              headers: { authorization: 'bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }
            });
            if (!response.ok) throw new Error('OIDC token request failed: HTTP ' + response.status);
            const data = await response.json();
            if (!data.value) throw new Error('OIDC token response did not contain a value');
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'token=' + data.value + '\n');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Probe channels and persist results to Testagram PostgreSQL API
        env:
          TESTAGRAM_BACKEND_URL: ${{ vars.TESTAGRAM_BACKEND_URL }}
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          node <<'NODE'
          (async () => {
          const fs = require('fs');
          const { performance } = require('perf_hooks');
          const data = JSON.parse(fs.readFileSync('public/tv/channels.json', 'utf8'));
          const channels = Array.isArray(data.channels) ? data.channels : [];
          const backend = (process.env.TESTAGRAM_BACKEND_URL || '').replace(/\/+$/, '');
          const token = process.env.GITHUB_OIDC_TOKEN;
          if (!backend || !/^https:\/\//i.test(backend)) {
            throw new Error('Set the repository Actions variable TESTAGRAM_BACKEND_URL to the deployed HTTPS Go API base URL.');
          }
          if (!token) throw new Error('GitHub Actions OIDC token is unavailable.');

          const batchSize = 50;
          const maxPerRun = 500;
          const alwaysProbe = Math.min(100, channels.length);
          const rotating = channels.slice(alwaysProbe).sort((a, b) => String(a.id).localeCompare(String(b.id)));
          const runSlot = Math.floor(Date.now() / 900000);
          const rotatingPerRun = Math.min(maxPerRun - alwaysProbe, rotating.length);
          let selected = channels.slice(0, alwaysProbe);
          if (rotatingPerRun > 0) {
            const start = (runSlot * rotatingPerRun) % rotating.length;
            selected = selected.concat(
              rotating.slice(start, start + rotatingPerRun),
              start + rotatingPerRun > rotating.length
                ? rotating.slice(0, start + rotatingPerRun - rotating.length)
                : []
            );
          }
          console.log(JSON.stringify({catalog_channels: channels.length, selected_for_run: selected.length, always_probe: alwaysProbe, rotating_per_run: rotatingPerRun}));

          const timeoutMs = 2500;
          async function readPlaylistPrefix(response, maxBytes = 8192) {
            if (!response.body) return '';
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let output = '';
            let total = 0;
            try {
              while (total < maxBytes) {
                const {done, value} = await reader.read();
                if (done) break;
                const remaining = maxBytes - total;
                const chunk = value.subarray(0, remaining);
                total += chunk.byteLength;
                output += decoder.decode(chunk, {stream: true});
                if (chunk.byteLength < value.byteLength) break;
              }
            } finally {
              await reader.cancel().catch(() => {});
            }
            return output + decoder.decode();
          }

          async function probe(channel) {
            const started = performance.now();
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
              const response = await fetch(String(channel.url), {
                method: 'GET',
                redirect: 'follow',
                signal: controller.signal,
                headers: {
                  'User-Agent': 'TestagramTV-Health/1.0',
                  'Accept': 'application/vnd.apple.mpegurl,application/x-mpegURL,video/*,audio/*,*/*',
                  'Range': 'bytes=0-2047'
                }
              });
              const type = (response.headers.get('content-type') || '').toLowerCase();
              let online = response.ok || response.status === 206;
              if (online && /mpegurl|m3u/.test(type)) {
                const playlist = await readPlaylistPrefix(response);
                online = /#EXTM3U|#EXTINF|#EXT-X-/.test(playlist);
              }
              return {
                channel_id: String(channel.id),
                url: String(channel.url),
                is_online: online,
                latency_ms: Math.min(30000, Math.max(0, Math.round(performance.now() - started))),
                check_error: online ? '' : 'HTTP ' + response.status,
                source: String(channel.source || ''),
                country: String(channel.country || ''),
                group_name: String(channel.group || ''),
                priority: Number.isFinite(Number(channel.priority)) ? Math.max(0, Math.min(100000, Math.floor(Number(channel.priority)))) : 0
              };
            } catch (error) {
              return {
                channel_id: String(channel.id),
                url: String(channel.url),
                is_online: false,
                latency_ms: Math.min(30000, Math.max(0, Math.round(performance.now() - started))),
                check_error: error instanceof Error ? error.message.slice(0, 500) : 'probe failed',
                source: String(channel.source || ''),
                country: String(channel.country || ''),
                group_name: String(channel.group || ''),
                priority: Number.isFinite(Number(channel.priority)) ? Math.max(0, Math.min(100000, Math.floor(Number(channel.priority)))) : 0
              };
            } finally {
              clearTimeout(timer);
            }
          }

          async function mapLimit(items, limit, fn) {
            const output = new Array(items.length);
            let cursor = 0;
            const workers = Array.from({length: Math.min(limit, items.length)}, async () => {
              while (true) {
                const index = cursor++;
                if (index >= items.length) return;
                output[index] = await fn(items[index]);
              }
            });
            await Promise.all(workers);
            return output;
          }

          let totalChecked = 0;
          for (let offset = 0; offset < selected.length; offset += batchSize) {
            const batch = selected.slice(offset, offset + batchSize);
            const results = await mapLimit(batch, 12, probe);
            const response = await fetch(backend + '/internal/tv/health', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-github-oidc-token': token
              },
              body: JSON.stringify({channels: results})
            });
            if (!response.ok) {
              const body = (await response.text()).slice(0, 500);
              throw new Error('PostgreSQL TV health persistence batch ' + (Math.floor(offset / batchSize) + 1) + ' failed: HTTP ' + response.status + ' ' + body);
            }
            const persisted = await response.json();
            if (!persisted.ok || persisted.persisted !== results.length) {
              throw new Error('TV health persistence acknowledged an incomplete batch ' + (Math.floor(offset / batchSize) + 1));
            }
            totalChecked += results.length;
            console.log(JSON.stringify({batch: Math.floor(offset / batchSize) + 1, checked: results.length, online: results.filter(x => x.is_online).length, offline: results.filter(x => !x.is_online).length, persisted: persisted.persisted}));
          }
          console.log('Total channels checked and persisted to Testagram PostgreSQL: ' + totalChecked);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
