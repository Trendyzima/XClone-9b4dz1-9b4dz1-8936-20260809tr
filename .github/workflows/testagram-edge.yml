name: Testagram Embedded Edge CDN

on:
  pull_request:
    paths:
      - "services/testagram-edge/**"
      - ".github/workflows/testagram-edge.yml"
  push:
    branches: [main]
    paths:
      - "services/testagram-edge/**"
      - ".github/workflows/testagram-edge.yml"

permissions:
  contents: read

jobs:
  go-cdn:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/testagram-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/testagram-edge/go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/edge
      - name: Container build
        run: docker build --pull -t testagram-edge:ci .
