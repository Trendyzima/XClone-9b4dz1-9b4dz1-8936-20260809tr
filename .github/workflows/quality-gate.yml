name: Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '_build.cjs'
      - 'supabase/**'
      - '.github/workflows/quality-gate.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '_build.cjs'
      - '.github/workflows/quality-gate.yml'

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck, lint, build and interaction contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Dependency install attempt ${attempt}/3"
            if npm ci --no-audit --no-fund > /tmp/npm-ci-attempt.log 2>&1; then
              cat /tmp/npm-ci-attempt.log
              exit 0
            else
              status=$?
            fi
            cat /tmp/npm-ci-attempt.log
            if [ "${attempt}" -lt 3 ] && grep -Eqi 'statusCode: 50[234]|HTTP[^[:cntrl:]]*50[234]|ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENETUNREACH|socket hang up|network timeout' /tmp/npm-ci-attempt.log; then
              delay=$((attempt * 15))
              echo "Transient upstream/network failure detected (exit ${status}); retrying in ${delay}s." >&2
              sleep "${delay}"
              continue
            fi
            echo "Dependency installation failed without a retryable network error (exit ${status}), or all retries were exhausted." >&2
            exit "${status}"
          done
          exit 1
      - name: Verify checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git rev-parse HEAD
      - name: Reject uncommitted source mutation
        run: |
          if ! git diff --quiet -- src; then
            echo 'Working tree source mutation detected before validation.'
            git diff -- src
            exit 1
          fi
      - name: Typecheck web application
        run: |
          if grep -nE 'communicationService\.editMessage\([^,()]+,[^,()]+\)' src/pages/MessagesPage.tsx; then
            echo 'Stale two-argument MessagesPage editMessage call remains.'
            exit 1
          fi
          npx tsc --noEmit
      - name: Lint web application
        run: npm run lint
      - name: Validate ad slot and viewability contract
        run: npm run validate:ads
      - name: Validate cross-source home-feed identity contract
        run: npm run validate:home-feed-identity
      - name: Validate dual-backend replication contract and migration
        run: npm run validate:replication-contract
      - name: Build application
        run: npm run build
      - name: Verify PostCard canonical interaction contract
        shell: bash
        run: |
          set -euo pipefail
          test -f src/components/features/PostCard.tsx
          test -f src/services/postInteractionService.ts
          grep -q "togglePostLike" src/components/features/PostCard.tsx
          grep -q "togglePostRepost" src/components/features/PostCard.tsx
          grep -q "createFederatedReply" src/components/features/PostCard.tsx
          grep -q "remoteStatusUri" src/components/features/PostCard.tsx
          grep -q "isFederatedPost" src/components/features/PostCard.tsx
          grep -q "favorite" src/services/postInteractionService.ts
          grep -q "unfavorite" src/services/postInteractionService.ts
          grep -q "boost" src/services/postInteractionService.ts
          grep -q "unboost" src/services/postInteractionService.ts
          grep -q "reply" src/services/postInteractionService.ts
          if grep -q "supabase.from('post_likes')" src/components/features/PostCard.tsx; then exit 1; fi
          if grep -q "supabase.from('post_reposts')" src/components/features/PostCard.tsx; then exit 1; fi
          if grep -q "supabase.from('replies')" src/components/features/PostCard.tsx; then exit 1; fi
          if grep -qE "from\\(['\"]post_likes['\"]\\)|from\\(['\"]post_reposts['\"]\\)|from\\(['\"]replies['\"]\\)" src/components/features/PostCard.tsx; then exit 1; fi
          # Independent interaction architecture: each local interaction domain has
          # its own service/page, while post detail remains a composition surface.
          for f in             src/features/likes/likesService.ts             src/features/replies/repliesService.ts             src/features/reposts/repostsService.ts             src/features/quotes/quotesService.ts             src/features/quoteLikes/quoteLikesService.ts             src/pages/PostInteractionPage.tsx; do
            test -f "$f"
          done
          if grep -qE "supabase\\.from\\(['\"]replies['\"]\\)|supabase\\.from\\(['\"]reply_likes['\"]\\)" src/pages/PostThreadPage.tsx; then
            echo 'Nested reply persistence/read path remains in PostThreadPage.'
            exit 1
          fi
          if grep -qE "supabase\\.from\\(['\"]replies['\"]\\)|supabase\\.from\\(['\"]reply_likes['\"]\\)" src/components/features/PostCard.tsx; then
            echo 'Nested reply persistence/read path remains in PostCard.'
            exit 1
          fi

  replication-migration-postgres:
    name: Replication migrations PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name xclone-replication-migration-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Waiting for PostgreSQL (attempt ${attempt}/30)"
            if docker exec xclone-replication-migration-ci pg_isready -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs xclone-replication-migration-ci
          exit 1
      - name: Bootstrap Supabase roles and minimal source tables
        run: |
          set -euo pipefail
          docker exec -i xclone-replication-migration-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE TABLE public.profiles (
            id UUID PRIMARY KEY,
            account_status TEXT,
            discoverable_by_username BOOLEAN,
            protected_account BOOLEAN,
            username TEXT,
            display_name TEXT,
            bio TEXT,
            avatar_url TEXT
          );
          CREATE TABLE public.posts (
            id UUID PRIMARY KEY,
            author_id UUID,
            user_id UUID,
            content TEXT,
            body TEXT,
            visibility TEXT,
            community_id UUID,
            deleted_at TIMESTAMPTZ,
            created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
            updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
          );
          SQL
      - name: Apply both replication migrations
        run: |
          set -euo pipefail
          docker exec -i xclone-replication-migration-ci psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261019000000_dual_backend_replication.sql
          docker exec -i xclone-replication-migration-ci psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261019010000_replication_source_producers.sql
      - name: Verify normalized secret rejection and public-only tombstones
        run: |
          set -euo pipefail
          docker exec -i xclone-replication-migration-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $ci$
          BEGIN
            IF NOT public.platform_replication_has_forbidden_key('{"accessToken":"secret"}'::jsonb)
              OR NOT public.platform_replication_has_forbidden_key('{"meta":[{"serviceRoleKey":"secret"}]}'::jsonb)
              OR NOT public.platform_replication_has_forbidden_key('{"private.key":"secret"}'::jsonb)
              OR NOT public.platform_replication_has_forbidden_key('{"signedURL":"https://cdn.example/file"}'::jsonb) THEN
              RAISE EXCEPTION 'sensitive key normalization failed';
            END IF;
          END $ci$;
          INSERT INTO public.profiles
            (id, account_status, discoverable_by_username, protected_account, username, display_name)
          VALUES
            ('123e4567-e89b-42d3-a456-426614174000', 'active', TRUE, FALSE, 'ci_public', 'CI Public'),
            ('123e4567-e89b-42d3-a456-426614174002', 'active', TRUE, TRUE, 'ci_private', 'CI Private');
          INSERT INTO public.posts(id, author_id, content, visibility)
          VALUES ('123e4567-e89b-42d3-a456-426614174001',
                  '123e4567-e89b-42d3-a456-426614174000', 'public integration post', 'public');
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM public.platform_replication_outbox) <> 2 THEN
              RAISE EXCEPTION 'only public profile and post events should be emitted';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.platform_replication_outbox
              WHERE entity_id='123e4567-e89b-42d3-a456-426614174002'
            ) THEN
              RAISE EXCEPTION 'protected profile must not be projected';
            END IF;
          END $ci$;
          UPDATE public.profiles SET protected_account=TRUE
          WHERE id='123e4567-e89b-42d3-a456-426614174000';
          DO $ci$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.platform_replication_outbox
              WHERE entity_type='account' AND event_type='account.profile.deleted'
                AND entity_id='123e4567-e89b-42d3-a456-426614174000' AND payload='{}'::jsonb
            ) THEN
              RAISE EXCEPTION 'protecting an account must emit a profile tombstone';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.platform_replication_outbox
              WHERE entity_type='post' AND event_type='post.deleted'
                AND entity_id='123e4567-e89b-42d3-a456-426614174001' AND payload='{}'::jsonb
            ) THEN
              RAISE EXCEPTION 'protecting an account must tombstone its public posts';
            END IF;
          END $ci$;
          SQL
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop xclone-replication-migration-ci || true

# Verification trigger: run the canonical gate against the committed tree only.
