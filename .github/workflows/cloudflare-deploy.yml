name: Testagram Cloudflare Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testagram-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Testagram
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production health
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl --fail --silent --show-error https://testagram.site/api/health > health.json; then
              break
            fi
            sleep 5
          done
          node -e 'const p=JSON.parse(require("fs").readFileSync("health.json","utf8")); if(p?.ok!==true || p?.service!=="testagram"){console.error(p);process.exit(1)} console.log(p)'
