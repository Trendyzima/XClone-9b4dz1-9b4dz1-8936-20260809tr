name: Deploy Testagram TV SRS Media Gateway
on:
  push:
    branches: [main]
    paths: ["tv-srs/**", ".github/workflows/testagram-tv-srs-production.yml"]
  workflow_dispatch:
concurrency:
  group: testagram-tv-srs-production
  cancel-in-progress: true
permissions:
  contents: read
env:
  SRS_DOMAIN: ${{ vars.SRS_DOMAIN || 'media.testagram.site' }}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validate production media-host configuration
        env:
          SSH_HOST: ${{ secrets.MEDIA_ENGINE_SSH_HOST }}
          SSH_USER: ${{ secrets.MEDIA_ENGINE_SSH_USER }}
          SSH_KEY: ${{ secrets.MEDIA_ENGINE_SSH_PRIVATE_KEY }}
          PUBLIC_IP: ${{ secrets.MEDIA_ENGINE_PUBLIC_IP }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_KEY" ]] || { echo "::error::Testagram media-host SSH credentials are required."; exit 1; }
          [[ "$PUBLIC_IP" =~ ^([0-9]{1,3}.){3}[0-9]{1,3}$ ]] || { echo "::error::MEDIA_ENGINE_PUBLIC_IP must be IPv4."; exit 1; }
          [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" ]] || { echo "::error::Vercel credentials are required for media DNS reconciliation."; exit 1; }
      - name: Reconcile Testagram-owned media DNS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PUBLIC_IP: ${{ secrets.MEDIA_ENGINE_PUBLIC_IP }}
        run: |
          set -euo pipefail
          npx --yes vercel@54.15.1 dns ls testagram.site --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" > dns-before.txt
          if grep -Eiq "media[[:space:]]+A[[:space:]]+$PUBLIC_IP([[:space:]]|$)" dns-before.txt; then
            echo "media.testagram.site already points to the Testagram TV media host."
          elif grep -Eiq "media[[:space:]]+A[[:space:]]+" dns-before.txt; then
            echo "::error::media.testagram.site has an unexpected A record; refusing to overwrite it."
            grep -Ei "media[[:space:]]+A[[:space:]]+" dns-before.txt || true
            exit 1
          else
            npx --yes vercel@54.15.1 dns add testagram.site media A "$PUBLIC_IP" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          fi
          for attempt in $(seq 1 20); do
            resolved="$(getent ahostsv4 "$SRS_DOMAIN" | awk 'NR==1 {print $1}' || true)"
            if [[ "$resolved" == "$PUBLIC_IP" ]]; then break; fi
            echo "Waiting for DNS propagation ($attempt/20): ${resolved:-unresolved}"
            sleep 5
          done
          resolved="$(getent ahostsv4 "$SRS_DOMAIN" | awk 'NR==1 {print $1}' || true)"
          [[ "$resolved" == "$PUBLIC_IP" ]] || { echo "::error::DNS for $SRS_DOMAIN did not resolve to $PUBLIC_IP."; exit 1; }
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.MEDIA_ENGINE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.MEDIA_ENGINE_SSH_HOST }}
          SSH_USER: ${{ secrets.MEDIA_ENGINE_SSH_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s
' "$SSH_KEY" > ~/.ssh/testagram-tv-srs
          chmod 600 ~/.ssh/testagram-tv-srs
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host testagram-tv-srs
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/testagram-tv-srs
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
      - name: Validate host and ports
        run: |
          set -euo pipefail
          ssh testagram-tv-srs '
            set -euo pipefail
            command -v docker >/dev/null
            docker compose version >/dev/null
            if ss -lntp 2>/dev/null | grep -E ":(80|443|8000) " | grep -vE "(docker-proxy|caddy|srs)" >/dev/null; then
              echo "::error::Required Testagram TV ports are occupied by an unexpected process."
              ss -lntp 2>/dev/null | grep -E ":(80|443|8000) " || true
              exit 1
            fi
          '
      - name: Copy Testagram TV media gateway
        run: |
          set -euo pipefail
          ssh testagram-tv-srs 'mkdir -p /opt/testagram/tv-srs'
          scp tv-srs/docker-compose.yml tv-srs/Caddyfile tv-srs/srs.conf tv-srs/README.md testagram-tv-srs:/opt/testagram/tv-srs/
      - name: Launch Testagram-owned SRS
        env:
          PUBLIC_IP: ${{ secrets.MEDIA_ENGINE_PUBLIC_IP }}
          DOMAIN: ${{ env.SRS_DOMAIN }}
        run: |
          set -euo pipefail
          umask 077
          ssh testagram-tv-srs "cat > /opt/testagram/tv-srs/.env" <<EOF
          SRS_PUBLIC_IP=$PUBLIC_IP
          SRS_DOMAIN=$DOMAIN
          EOF
          ssh testagram-tv-srs '
            set -euo pipefail
            cd /opt/testagram/tv-srs
            docker compose config -q
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
          '
      - name: Verify local gateway
        env:
          DOMAIN: ${{ env.SRS_DOMAIN }}
        run: |
          set -euo pipefail
          ssh testagram-tv-srs "curl --fail --silent --show-error --max-time 10 -k -H 'Host: $DOMAIN' https://127.0.0.1/healthz > /tmp/tv-srs-health.json"
          ssh testagram-tv-srs 'cat /tmp/tv-srs-health.json'
          ssh testagram-tv-srs 'docker compose -f /opt/testagram/tv-srs/docker-compose.yml ps --status running | grep -E "srs|caddy" >/dev/null'
      - name: Verify public HTTPS gateway
        env:
          DOMAIN: ${{ env.SRS_DOMAIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 "https://$DOMAIN/healthz" > srs-public-health.json; then break; fi
            echo "Waiting for public Testagram TV gateway ($attempt/24)..."
            sleep 5
          done
          test -s srs-public-health.json
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("srs-public-health.json","utf8")); if(p?.code!==0 && !p?.data && !p?.version){console.error("Unexpected SRS health/API response:",p);process.exit(1)} console.log("Public SRS gateway reachable:",p)'
      - name: Verify WHIP transport surface
        env:
          DOMAIN: ${{ env.SRS_DOMAIN }}
        run: |
          set -euo pipefail
          status="$(curl -k -sS -o /tmp/whip-response.txt -w '%{http_code}' --max-time 10 -X POST -H 'Content-Type: application/sdp' --data-binary 'v=0
o=- 0 0 IN IP4 127.0.0.1
s=-
t=0 0
' "https://$DOMAIN/rtc/v1/whip/?app=live&stream=connectivity-probe")"
          echo "WHIP probe HTTP status: $status"
          case "$status" in
            400|401|403|404|415|422|500) echo "WHIP endpoint is reachable and rejected intentionally invalid SDP."; ;;
            201|200) echo "::error::Unexpectedly accepted invalid SDP."; exit 1 ;;
            *) echo "::error::WHIP transport is not reachable (HTTP $status)."; exit 1 ;;
          esac
      - name: Verify SRS management API is not public
        env:
          DOMAIN: ${{ env.SRS_DOMAIN }}
        run: |
          set -euo pipefail
          status="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$DOMAIN/srs-api/versions" || true)"
          echo "Public SRS management route status: $status"
          [[ "$status" == "404" ]] || { echo "::error::SRS management API must not be publicly exposed."; exit 1; }
      - name: Report
        run: echo "Testagram TV SRS gateway is deployed, owned by Testagram, and externally reachable."
