name: Media transport legacy compatibility check
on:
  push:
    paths:
      - ".github/workflows/livekit-production-sync.yml"
  workflow_dispatch:
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm LiveKit transport is retired for TV
        run: |
          echo "Testagram TV uses the self-hosted Testagram Media Engine."
          echo "No LiveKit credentials are required for the TV transport."
          echo "Legacy LiveKit integrations remain only for non-TV surfaces until migrated.";
