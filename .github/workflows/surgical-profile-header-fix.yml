name: Surgical profile header repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix(profile): separate header controls from avatar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair profile header layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/ProfilePage.tsx')
          s = p.read_text()

          old = '''      <ProfileAdBanner />\n        {isOwnProfile && <AdvertiserSurface variant="profile" />}\n\n      <div className="border-b border-border">'''
          new = '''      <div className="px-4 pt-3 pb-2 space-y-3">\n        <ProfileAdBanner />\n        {isOwnProfile && <AdvertiserSurface variant="profile" />}\n      </div>\n\n      <div className="border-b border-border">'''
          if old not in s:
              raise SystemExit('Expected ad/header boundary was not found')
          s = s.replace(old, new, 1)

          old2 = '''        <div className="px-4 pb-4">\n          <div className="flex justify-between items-start -mt-16 mb-4">'''
          new2 = '''        <div className="px-4 pb-4">\n          <div className="grid grid-cols-1 sm:grid-cols-[auto_minmax(0,1fr)] items-start gap-3 sm:gap-4 -mt-16 mb-5">'''
          if old2 not in s:
              raise SystemExit('Expected profile action row was not found')
          s = s.replace(old2, new2, 1)

          old3 = '''            <div className="flex flex-wrap items-center gap-2.5 mt-4 max-w-full">'''
          new3 = '''            <div className="min-w-0 w-full sm:w-auto sm:justify-self-end sm:max-w-full pt-0 sm:pt-5">\n              <div className="flex flex-wrap items-center justify-start sm:justify-end gap-2.5 max-w-full">'''
          if old3 not in s:
              raise SystemExit('Expected profile action controls wrapper was not found')
          s = s.replace(old3, new3, 1)

          marker = '''              )}\n            </div>\n          </div>\n\n          <div className="mb-3">'''
          replacement = '''              )}\n              </div>\n            </div>\n          </div>\n\n          <div className="mb-3">'''
          if marker not in s:
              raise SystemExit('Expected profile action controls closing boundary was not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          print('Surgical profile header layout repair applied')
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProfilePage.tsx .github/workflows/surgical-profile-header-fix.yml
          git commit -m "fix(profile): separate header controls from avatar"
          git push
