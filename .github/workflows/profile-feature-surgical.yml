name: Profile feature hub surgical integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch router and profile surgically
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          import_anchor = "const ProfilePage = lazy(() => import('@/pages/ProfilePage'));"
          import_line = "const ProfileFeaturesPage = lazy(() => import('@/pages/ProfileFeaturesPage'));"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('App import anchor not found')
              text = text.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          route_old = '<Route path="/profile/:username" element={<ProfilePage/>}/>'
          route_new = route_old + '<Route path="/profile-features" element={<ProfileFeaturesPage/>}/>'
          if 'path="/profile-features"' not in text:
              if route_old not in text:
                  raise SystemExit('Profile route anchor not found')
              text = text.replace(route_old, route_new, 1)
          app.write_text(text)

          profile = Path('src/pages/ProfilePage.tsx')
          text = profile.read_text()
          old_actions = '<div className="flex gap-2 mt-2 flex-wrap items-center">'
          new_actions = '<div className="flex flex-wrap items-center gap-2.5 mt-4 max-w-full">'
          if old_actions in text:
              text = text.replace(old_actions, new_actions, 1)

          marker = '<button onClick={() => setShowEditDialog(true)} className="px-4 py-2 border border-border rounded-full font-semibold hover:bg-muted transition-colors">Edit profile</button>'
          feature_button = '''<button onClick={() => navigate('/profile-features')} className="inline-flex items-center gap-1.5 px-3.5 py-2 border border-primary/20 bg-primary/5 text-primary rounded-full font-semibold text-sm hover:bg-primary/10 transition-colors">
                    <Sparkles className="w-3.5 h-3.5" />More features
                  </button>'''
          if 'navigate(\'/profile-features\')' not in text:
              if marker not in text:
                  raise SystemExit('Own-profile Edit profile anchor not found')
              text = text.replace(marker, marker + '\n                  ' + feature_button, 1)
          profile.write_text(text)

      - name: Verify source integration
        run: |
          grep -q "ProfileFeaturesPage" src/App.tsx
          grep -q 'path="/profile-features"' src/App.tsx
          grep -q "navigate('/profile-features')" src/pages/ProfilePage.tsx
          test -f src/pages/ProfileFeaturesPage.tsx

      - name: Verify clean TypeScript build
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run build

      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/profile-feature-surgical.yml .github/profile-feature-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/pages/ProfilePage.tsx .github/workflows/profile-feature-surgical.yml .github/profile-feature-trigger.txt
          if git diff --cached --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git commit -m 'feat(profile): integrate functional feature hub'
          git push origin HEAD:main
