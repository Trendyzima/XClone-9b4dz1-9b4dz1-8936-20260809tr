name: Production Deployment Watchdog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: production-deployment-watchdog
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ORIGIN: "https://testagram.site"
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RECONCILIATION_WORKFLOW: production-deployment-reconciliation.yml
    steps:
      - name: Compare main with exact READY production revision
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/main" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).sha))')"

          health_status="$(curl -sS --location --connect-timeout 5 --max-time 15 -o health.json -w '%{http_code}' "$APP_ORIGIN/api/health" || true)"
          ready_status="$(curl -sS --location --connect-timeout 5 --max-time 15 -o readiness.json -w '%{http_code}' "$APP_ORIGIN/api/ready" || true)"

          production_sha="$(node -e '
            const fs=require("node:fs");
            let p={};
            try { p=JSON.parse(fs.readFileSync("health.json","utf8")); } catch {}
            process.stdout.write(p?.commit || "");
          ')"

          echo "main_sha=$main_sha"
          echo "production_health_status=${health_status:-UNKNOWN}"
          echo "production_ready_status=${ready_status:-UNKNOWN}"
          echo "production_sha=${production_sha:-UNKNOWN}"

          if [[ "$health_status" == "200" && "$production_sha" == "$main_sha" ]]; then
            if [[ "$ready_status" == "200" ]]; then
              echo "Production is healthy, ready, and matches main at the exact SHA."
              echo "needs_reconciliation=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Production revision matches main, but /api/ready failed (HTTP ${ready_status:-unknown}). This is a runtime/readiness incident; not dispatching a redeployment solely for database/readiness failure."
            echo "needs_reconciliation=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Production revision or health does not match main; reconciliation is required."
          echo "needs_reconciliation=true" >> "$GITHUB_OUTPUT"
          echo "target_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Avoid duplicate recovery attempts
        if: ${{ steps.compare.outputs.needs_reconciliation == 'true' }}
        id: cooldown
        shell: bash
        run: |
          set -euo pipefail

          runs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/$RECONCILIATION_WORKFLOW/runs?branch=main&per_page=1")"

          result="$(printf '%s' "$runs" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const p=JSON.parse(s);
              const r=p.workflow_runs?.[0];
              if (!r) { console.log("dispatch"); return; }
              const age=Date.now()-Date.parse(r.updated_at || r.created_at);
              console.log(r.status !== "completed" || age < 2*60*60*1000 ? "skip" : "dispatch");
            })')"

          echo "watchdog_decision=$result"

          if [[ "$result" == "skip" ]]; then
            echo "A reconciliation run is active or was attempted within the last two hours; no duplicate deployment request will be created."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch exact-SHA Cloudflare reconciliation
        if: ${{ steps.compare.outputs.needs_reconciliation == 'true' && steps.cooldown.outputs.dispatch == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          target_sha="${{ steps.compare.outputs.target_sha }}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Refusing to dispatch an invalid target SHA."; exit 1; }
          echo "Dispatching production reconciliation for exact SHA $target_sha"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          body="$(node -e 'console.log(JSON.stringify({ref:"main",inputs:{target_sha:process.argv[1]}}))' "$target_sha")"

          set +e
          http_status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REPO/actions/workflows/$RECONCILIATION_WORKFLOW/dispatches" \
            -d "$body")"
          curl_status=$?
          set -e

          if (( curl_status != 0 )); then
            echo "::error::GitHub workflow dispatch transport failed (curl exit $curl_status, HTTP ${http_status:-unknown})."
            exit "$curl_status"
          fi
          if [[ "$http_status" != "204" ]]; then
            echo "::error::GitHub rejected production reconciliation dispatch (HTTP $http_status)."
            node -e '
              const fs=require("node:fs");
              try {
                const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                if (p.message) console.log("GitHub message: "+String(p.message).slice(0,500));
                if (p.errors) console.log("GitHub validation details: "+JSON.stringify(p.errors).slice(0,500));
              } catch { console.log("GitHub response body was not JSON; omitted."); }
            ' "$response_file"
            exit 1
          fi

          echo "Cloudflare production reconciliation dispatched successfully (HTTP 204)."
