name: forensic-trends-ui-repair
on:
  push:
    branches: [main]
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'feat: register canonical trends capability')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair Trends UI contracts
        shell: python
        run: |
          from pathlib import Path

          explore = Path('src/pages/ExplorePage.tsx')
          s = explore.read_text()
          if "import { backendCapabilities } from '@/services/testagramCapabilityClient';" not in s:
              marker = "import { useSEO } from '@/hooks/useSEO';"
              if marker not in s:
                  raise SystemExit('ExplorePage import anchor not found')
              s = s.replace(marker, marker + "\nimport { backendCapabilities } from '@/services/testagramCapabilityClient';", 1)

          old = """    await supabase.rpc('refresh_trending_topics').catch(() => {});\n    const [trendingRes, hashtagRes, whoRes] = await Promise.all([\n      supabase.from('trending_topics').select('*').order('posts_count', { ascending: false }).limit(50),\n      supabase.from('trending_hashtags').select('hashtag_id, trend_score, daily_posts, hashtags(id, tag, usage_count)').order('trend_score', { ascending: false }).limit(20),"""
          new = """    const [trendingData, hashtagRes, whoRes] = await Promise.all([\n      backendCapabilities.getTrends(50),\n      supabase.from('trending_hashtags').select('hashtag_id, trend_score, daily_posts, hashtags(id, tag, usage_count)').order('trend_score', { ascending: false }).limit(20),"""
          if old not in s:
              raise SystemExit('ExplorePage trends fetch block not found')
          s = s.replace(old, new, 1)
          if "    setTrending(trendingRes.data ?? []);" not in s:
              raise SystemExit('ExplorePage trends assignment not found')
          s = s.replace("    setTrending(trendingRes.data ?? []);", "    setTrending(trendingData?.items ?? []);", 1)
          explore.write_text(s)

          hashtag = Path('src/pages/HashtagPage.tsx')
          h = hashtag.read_text()
          if "import { backendCapabilities } from '@/services/testagramCapabilityClient';" not in h:
              marker = "import { useSEO, buildHashtagLD, buildOgImageUrl } from '@/hooks/useSEO';"
              if marker not in h:
                  raise SystemExit('HashtagPage import anchor not found')
              h = h.replace(marker, marker + "\nimport { backendCapabilities } from '@/services/testagramCapabilityClient';", 1)

          old_h = """      const { data: hashtagData, error: hashtagError } = await supabase\n        .from('hashtags')\n        .select('*')\n        .eq('tag', tag?.toLowerCase())\n        .single();\n      if (hashtagError) throw hashtagError;\n      setHashtag(hashtagData);"""
          new_h = """      const hashtagResult = await backendCapabilities.searchHashtags(tag ?? '', 1);\n      const hashtagData = hashtagResult.items?.find((item: any) =>\n        String(item?.tag ?? '').toLowerCase() === String(tag ?? '').toLowerCase()\n      );\n      if (!hashtagData) throw new Error('HASHTAG_NOT_FOUND');\n      setHashtag(hashtagData);"""
          if old_h not in h:
              raise SystemExit('HashtagPage lookup block not found')
          h = h.replace(old_h, new_h, 1)
          hashtag.write_text(h)

          if "from('trending_topics')" in explore.read_text():
              raise SystemExit('Legacy trending_topics read remains in ExplorePage')
          if "backendCapabilities.getTrends(50)" not in explore.read_text():
              raise SystemExit('getTrends consumer missing')
          if "backendCapabilities.searchHashtags(tag ?? '', 1)" not in hashtag.read_text():
              raise SystemExit('canonical hashtag search consumer missing')

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ExplorePage.tsx src/pages/HashtagPage.tsx
          git commit -m 'fix: wire trends UI to canonical capabilities' || exit 0
          git push
