name: Flutter Mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-mobile.yml"

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Widget tests
        working-directory: mobile
        run: flutter test
