name: Workflow Syntax Gate

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate all GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go for the pinned actionlint release
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false

      - name: Install actionlint without archive extraction
        run: |
          set -euo pipefail
          GOBIN=/usr/local/bin go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint -version

      - name: Validate workflow syntax
        run: |
          set -euo pipefail
          actionlint -color
