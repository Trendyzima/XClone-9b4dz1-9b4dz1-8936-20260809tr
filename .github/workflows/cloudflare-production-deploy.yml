name: Deploy Testagram to Cloudflare Workers

on:
  workflow_run:
    workflows: ["Cloudflare Worker Build Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testagram-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Worker
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the exact commit that passed the build gate
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive

      - name: Checkout main for manual deployment
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: main
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: npm run build

      - name: Deploy Worker and attach configured custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx wrangler deploy --config wrangler.jsonc

      - name: Verify production hostname responses
        run: |
          set -euo pipefail
          for host in testagram.site www.testagram.site; do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://${host}/")"
            echo "${host}: HTTP ${code}"
            case "$code" in
              2*) ;;
              *) echo "::error::Production hostname ${host} returned HTTP ${code}"; exit 1 ;;
            esac
          done
