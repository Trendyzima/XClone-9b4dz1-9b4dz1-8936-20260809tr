name: TV Production Validation

on:
  pull_request:
    paths:
      - "api/live.ts"
      - "src/lib/testagramTvMedia.ts"
      - "src/pages/TvStudioPage.tsx"
      - "src/pages/TvPublicLivePage.tsx"
      - "supabase/functions/tv-media-control/**"
      - "supabase/functions/testagram-media-token/**"
      - "supabase/migrations/*tv*"
      - ".github/workflows/production-deployment-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Enforce single native TV media path
        shell: bash
        run: |
          set -euo pipefail
          active_files="api/live.ts src/lib/testagramTvMedia.ts src/pages/TvStudioPage.tsx src/pages/TvPublicLivePage.tsx supabase/functions/tv-media-control/index.ts supabase/functions/testagram-media-token/index.ts"
          if grep -Ein 'cloudflare|MUX_TOKEN|VITE_MUX|TV_SECONDARY_DISTRIBUTION|mux_live_stream_id|mux_playback_id|cloudflare_input_id|cloudflare_output_id|youtube_broadcast_id|youtube_stream_id|youtube_output_id|MEDIA_ENGINE_SSH_|MEDIA_ENGINE_PUBLIC_IP|SRS_MEDIA_BASE_URL|WHIP|WHEP|tv-media\.testagram\.site' $active_files; then
            echo "::error::Retired external TV media-provider or media-host references remain in active TV software."
            exit 1
          fi
          grep -q 'provider: "native-p2p"' supabase/functions/tv-media-control/index.ts
          grep -q "tv-media-control" api/live.ts
          grep -q "supabase.channel" src/lib/testagramTvMedia.ts
          grep -q "runtime: \"edge\"" api/live.ts
          test ! -d tv-srs
          echo "Native TV edge/control/signaling contract passed."

      - name: Enforce retired TV deployment secrets are absent from workflow
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'MEDIA_ENGINE_SSH_HOST|MEDIA_ENGINE_SSH_USER|MEDIA_ENGINE_SSH_PRIVATE_KEY|MEDIA_ENGINE_PUBLIC_IP|Deploy Testagram-owned TV SRS' .github/workflows; then
            echo "::error::Retired TV media-host deployment credentials or deployment steps remain in CI."
            exit 1
          fi
          echo "No TV media-host SSH deployment contract remains."
