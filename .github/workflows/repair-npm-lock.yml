name: Repair npm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit lockfile and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/repair-npm-lock.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: add npm lockfile for reproducible CI installs'
          git push
          git rm .github/workflows/repair-npm-lock.yml
          git commit -m 'chore: remove one-shot npm lock repair workflow'
          git push
