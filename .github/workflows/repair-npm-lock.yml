name: Repair npm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: env -u NODE_OPTIONS npm run lint

      - name: Build
        run: env -u NODE_OPTIONS npm run build

      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes to commit.'
            exit 0
          fi
          git commit -m 'chore: add npm lockfile for reproducible CI installs'
          git push
