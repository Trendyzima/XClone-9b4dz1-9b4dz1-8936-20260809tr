name: Temporary Fediverse formatter patch
on:
  pull_request:
    paths:
      - '.github/workflows/fediverse-format-patch.yml'
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Print formatter patch
        working-directory: mobile
        run: |
          dart format lib/features/fediverse/fediverse_page.dart
          git diff --no-ext-diff -- lib/features/fediverse/fediverse_page.dart
