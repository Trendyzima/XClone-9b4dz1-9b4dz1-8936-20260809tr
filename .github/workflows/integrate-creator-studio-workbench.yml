name: Integrate Creator Studio Workbench
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Surgically integrate workbench
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/CreatorStudio.tsx')
          s = p.read_text()
          import_line = "import { CreatorStudioWorkbench } from '@/components/features/CreatorStudioWorkbench';"
          if import_line not in s:
              anchor = "import { PageAdBanner } from '@/components/features/AdSenseAd';"
              if anchor not in s:
                  raise SystemExit('CreatorStudio AdSense import anchor not found')
              s = s.replace(anchor, anchor + '\n' + import_line, 1)
          if '<CreatorStudioWorkbench stats={stats} recentPosts={recentPosts} />' not in s:
              marker = '  return ('
              pos = s.rfind(marker)
              if pos < 0:
                  raise SystemExit('CreatorStudio render return not found')
              insert_at = pos + len(marker)
              s = s[:insert_at] + '\n      <CreatorStudioWorkbench stats={stats} recentPosts={recentPosts} />' + s[insert_at:]
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/pages/CreatorStudio.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CreatorStudio.tsx
          git commit -m 'feat: integrate creator studio workbench' || exit 0
          git push origin main
      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/integrate-creator-studio-workbench.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove creator studio integration workflow'
          git push origin main
