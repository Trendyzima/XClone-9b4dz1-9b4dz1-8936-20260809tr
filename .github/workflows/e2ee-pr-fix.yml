name: communications-e2ee-pr-cleanup
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'surgical/communications-e2ee-complete-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: surgical/communications-e2ee-complete-v2
          fetch-depth: 0
      - name: Remove duplicate surgical insertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('src/pages/MessagesPage.tsx')
          text = page.read_text()
          text = text.replace("import { communicationCrypto } from '@/services/communicationCrypto';\nimport { communicationCrypto } from '@/services/communicationCrypto';", "import { communicationCrypto } from '@/services/communicationCrypto';")
          text = text.replace("await r.setE2EEEnabled(true); await r.setE2EEEnabled(true);", "await r.setE2EEEnabled(true);")
          page.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/MessagesPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remove duplicate communications E2EE wiring"
          git push origin surgical/communications-e2ee-complete-v2
