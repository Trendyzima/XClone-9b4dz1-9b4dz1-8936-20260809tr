name: Fresh Infrastructure Reconciliation

on:
  push:
    branches: [main]
    paths:
      - ".env.fresh.example"
      - "src/lib/appwrite.ts"
      - "src/services/appwriteAuth.ts"
      - "src/services/socialApiClient.ts"
      - "src/services/freshMediaApi.ts"
      - "scripts/validate-appwrite-auth.mjs"
      - "scripts/validate-appwrite-client.mjs"
      - ".github/workflows/infrastructure-reconciliation.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-infrastructure-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Verify Appwrite, Backend API and dual-store client contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Validate Appwrite authentication and client configuration
        run: |
          npm run validate:appwrite-auth
          npm run validate:appwrite-client
      - name: Verify fresh runtime has no legacy identity fallback
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^VITE_TESTAGRAM_AUTH_PROVIDER=appwrite$' .env.fresh.example
          grep -q '^VITE_TESTAGRAM_FRESH_API_URL=https://api.testagram.site$' .env.fresh.example
          grep -q '^VITE_APPWRITE_ENDPOINT=https://cloud.appwrite.io/v1$' .env.fresh.example
          if grep -Eq '^VITE_SUPABASE_' .env.fresh.example; then
            echo "::error::Fresh build template contains a retired identity-provider variable."
            exit 1
          fi
          grep -q "provider === 'appwrite'" src/services/socialApiClient.ts
          grep -q "primary_provider" src/services/freshMediaApi.ts
          grep -q "r2.cloudflarestorage.com" src/services/freshMediaApi.ts || true
          echo "Fresh Appwrite identity, Backend API and selected B2/R2 upload contract: PASS"
