name: One-shot Stories canonical ad migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[stories-p1]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply P1 surgical migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/features/StoriesStrip.tsx')
          s = p.read_text()
          if ".from('user_ads')" not in s: raise SystemExit('Expected legacy user_ads reference missing')
          s = s.replace("import { StoryAdSlide, checkStoryAdFreqCap } from './StoryAdSlide';", "import { StoryAdSlide } from './StoryAdSlide';")
          s, n = re.subn(r"  // ── Story Ads: inject between groups ──────────────────────────────────────.*?  // ── Story Creation Rewards", "  // ── Canonical Story Ads ────────────────────────────────────────────────────\n  // Eligibility, frequency caps, campaign selection, impression accounting, and spend are server-owned.\n  const [showCanonicalStoryAd, setShowCanonicalStoryAd] = useState(false);\n\n  // ── Story Creation Rewards", s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'legacy state block matches={n}')
          s = re.sub(r"\s*maybeShowStoryAd\(\);", '', s)
          s, n = re.subn(r"\s*\{\/\* Ad injection in Explore \*\/\}[\\s\\S]*?\n\s*<div className=\"grid grid-cols-2 gap-3\">", "\n              <div className=\"grid grid-cols-2 gap-3\">", s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'legacy Explore block matches={n}')
          s, n = re.subn(r"      /\* ── Story Ad Slide ── \*/.*?      \}\n\n      /\* ── Explore Stories Sheet ── \*/", "      {/* ── Canonical Story Ad Slide ───────────────────────────────────────── */}\n      {showCanonicalStoryAd && viewerStory && (\n        <StoryAdSlide\n          ad={{\n            id: 'story-slot',\n            source_id: viewerStory.id,\n            source_type: 'story',\n            author_id: viewerG?.userId ?? null,\n          }}\n          onComplete={() => setShowCanonicalStoryAd(false)}\n          onSkip={() => setShowCanonicalStoryAd(false)}\n        />\n      )}\n\n      {/* ── Explore Stories Sheet ── */}", s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'legacy StoryAdSlide render matches={n}')
          marker = "      if (meta?.music?.preview_url) playStoryAudio(meta.music.preview_url);\n    }\n  };"
          if marker not in s: raise SystemExit('openViewer marker not found')
          s = s.replace(marker, "      if (meta?.music?.preview_url) playStoryAudio(meta.music.preview_url);\n      setShowCanonicalStoryAd(true);\n    }\n  };", 1)
          forbidden = ['user_ads', 'storyAds', 'currentStoryAd', 'showStoryAd', 'storyGroupViewCount', 'AD_INJECT_INTERVAL', 'maybeShowStoryAd', 'checkStoryAdFreqCap']
          leftovers = [x for x in forbidden if x in s]
          if leftovers: raise SystemExit('Legacy identifiers remain: ' + ', '.join(leftovers))
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/features/StoriesStrip.tsx
          git diff --cached --check
          git commit -m "fix: route Stories ads through canonical Testagram Ads [stories-p1]"
          git push
