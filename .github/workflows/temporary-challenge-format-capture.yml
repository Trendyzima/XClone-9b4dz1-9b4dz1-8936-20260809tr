name: Temporary challenge Dart formatter capture

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/lib/features/challenges/challenge_pages.dart'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
      - name: Format and emit challenge source
        working-directory: mobile
        run: |
          dart format lib/features/challenges/challenge_pages.dart
          cat lib/features/challenges/challenge_pages.dart
