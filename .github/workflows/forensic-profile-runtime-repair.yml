name: Forensic profile runtime repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical PostgREST and profile schema repairs
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/pages/ProfilePage.tsx')
          s=p.read_text(encoding='utf-8')
          original=s
          s=s.replace("select('*, profiles (*)')", "select('*, profiles!posts_user_id_fkey(*)')")
          s=s.replace("select('*, posts(*, profiles(*))')", "select('*, posts(*, profiles!posts_user_id_fkey(*))')")
          s=s.replace("select('posts(*, profiles(*))')", "select('posts(*, profiles!posts_user_id_fkey(*))')")
          s=s.replace("twitter_handle: cleanTw,\n      instagram_handle: cleanIg,\n      linkedin_url: cleanLi,", "social_links: { twitter: cleanTw, instagram: cleanIg, linkedin: cleanLi },")
          s=s.replace("tier, price, status: 'active',", "tier, amount: price, status: 'active',")
          s=s.replace("source: 'subscription', amount: price, status: 'paid'", "source: 'subscription', amount_cents: Math.round(price * 100), currency: 'USD', status: 'paid'")
          s=s.replace("source: 'tips', amount, status: 'paid'", "source: 'tips', amount_cents: Math.round(amount * 100), currency: 'USD', status: 'paid'")
          s=s.replace("{ from_user_id: currentUser.id, to_user_id: profile.id, amount, message: `Tip from @${currentUser.username}` }", "{ sender_id: currentUser.id, recipient_id: profile.id, amount_cents: Math.round(amount * 100), currency: 'USD', provider: 'internal', status: 'completed' }")
          s=s.replace("select('monthly_tip_goal')", "select('total_earnings')")
          s=s.replace("setTipGoal(mon?.monthly_tip_goal ?? null);", "setTipGoal(null);")
          s=s.replace("select('from_user_id, amount').eq('to_user_id', userId)", "select('sender_id, amount_cents').eq('recipient_id', userId)")
          s=s.replace("Number(t.amount)", "Number(t.amount_cents ?? 0) / 100")
          s=s.replace("t.from_user_id", "t.sender_id")
          s=s.replace("const { error } = await supabase.from('user_monetization').upsert({ user_id: profile.id, monthly_tip_goal: goal }, { onConflict: 'user_id' });\n    if (error) { toast.error('Failed to save goal'); return; }", "toast.info('Tip goals are not part of the canonical monetization schema yet.'); return;")
          old="const normalizedProfile = { ...profileData, twitter_handle: socialLinks.twitter ?? null, instagram_handle: socialLinks.instagram ?? null, linkedin_url: socialLinks.linkedin ?? null, cover_image: profileData.cover_url ?? null, verified: profileData.verified_tier !== 'none' };"
          new="const { data: monetization } = await supabase.from('user_monetization').select('total_earnings').eq('user_id', profileData.id).maybeSingle();\n      const normalizedProfile = { ...profileData, twitter_handle: socialLinks.twitter ?? null, instagram_handle: socialLinks.instagram ?? null, linkedin_url: socialLinks.linkedin ?? null, cover_image: profileData.cover_url ?? null, verified: profileData.verified_tier !== 'none', total_earnings: monetization?.total_earnings ?? 0 };"
          if old in s: s=s.replace(old,new,1)
          if s==original: raise SystemExit('No ProfilePage changes matched; refusing false repair')
          p.write_text(s,encoding='utf-8')
          print('ProfilePage patched')
      - name: Commit repaired source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/ProfilePage.tsx
          git commit -m 'fix(profile): eliminate runtime schema and relationship mismatches'
          git push origin HEAD:main
      - name: Remove repair workflow
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/forensic-profile-runtime-repair.yml
          git commit -m 'chore(forensics): remove profile runtime repair workflow'
          git push origin HEAD:main
