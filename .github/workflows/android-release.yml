name: Testagram Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.2.0)"
        required: true
        default: "v0.2.0"
  push:
    branches:
      - main
      - "release/*"
    paths:
      - "android/**"
      - "public/**"
      - "src/**"
      - "api/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "_build.cjs"
      - "vite.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish the production WebView Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build and verify web application
        run: npm run build

      - name: Configure Android release signing
        env:
          TESTAGRAM_RELEASE_KEYSTORE_BASE64: ${{ secrets.TESTAGRAM_RELEASE_KEYSTORE_BASE64 }}
          TESTAGRAM_RELEASE_KEY_ALIAS: ${{ secrets.TESTAGRAM_RELEASE_KEY_ALIAS }}
          TESTAGRAM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEYSTORE_PASSWORD }}
          TESTAGRAM_RELEASE_KEY_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TESTAGRAM_RELEASE_KEYSTORE_BASE64}" || { echo "::error::TESTAGRAM_RELEASE_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "${TESTAGRAM_RELEASE_KEY_ALIAS}" || { echo "::error::TESTAGRAM_RELEASE_KEY_ALIAS is not configured"; exit 1; }
          test -n "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" || { echo "::error::TESTAGRAM_RELEASE_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "${TESTAGRAM_RELEASE_KEY_PASSWORD}" || { echo "::error::TESTAGRAM_RELEASE_KEY_PASSWORD is not configured"; exit 1; }
          python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ["TESTAGRAM_RELEASE_KEYSTORE_BASE64"]
          normalized = "".join(raw.split())
          if not normalized:
              raise SystemExit("empty keystore secret")
          # Accept a correctly encoded Base64 value even when trailing '=' padding
          # was omitted by the secret-entry UI; reject every other corruption.
          normalized += "=" * ((4 - len(normalized) % 4) % 4)
          try:
              decoded = base64.b64decode(normalized, validate=True)
          except Exception as exc:
              raise SystemExit(f"keystore secret is not valid Base64: {exc}")
          if not decoded:
              raise SystemExit("decoded keystore is empty")
          pathlib.Path("android/testagram-release.jks").write_bytes(decoded)
          print(f"Decoded keystore bytes: {len(decoded)}")
          PY
          test -s android/testagram-release.jks
          # Let keytool perform the authoritative keystore-format validation.
          # Do not rely on magic bytes: JKS and PKCS12 containers can have different
          # encodings, and a valid keystore may legitimately begin with another header.
          cat > android/keystore.properties <<EOF
          storeFile=testagram-release.jks
          storePassword=${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}
          keyAlias=${TESTAGRAM_RELEASE_KEY_ALIAS}
          keyPassword=${TESTAGRAM_RELEASE_KEY_PASSWORD}
          EOF

      - name: Forensic signing preflight
        working-directory: android
        env:
          TESTAGRAM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEYSTORE_PASSWORD }}
          TESTAGRAM_RELEASE_KEY_ALIAS: ${{ secrets.TESTAGRAM_RELEASE_KEY_ALIAS }}
          TESTAGRAM_RELEASE_KEY_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE="testagram-release.jks"
          echo "Checking release keystore integrity without printing credentials..."
          if ! keytool -list -keystore "${STORE}" -storepass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" >/dev/null 2>&1; then
            echo "::error::TESTAGRAM_RELEASE_KEYSTORE_PASSWORD does not unlock the uploaded keystore. The keystore/password pair is inconsistent."
            exit 1
          fi
          if ! keytool -list -keystore "${STORE}" -storepass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" -alias "${TESTAGRAM_RELEASE_KEY_ALIAS}" -keypass "${TESTAGRAM_RELEASE_KEY_PASSWORD}" >/dev/null 2>&1; then
            echo "::error::The keystore opens, but TESTAGRAM_RELEASE_KEY_ALIAS and/or TESTAGRAM_RELEASE_KEY_PASSWORD does not unlock the release key."
            exit 1
          fi
          echo "Release keystore, alias, and key password are internally consistent."
      - name: Build signed Android APK and App Bundle
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify release artifacts
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "${APK}"
          test -s "${AAB}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"
          "${APKSIGNER}" verify --verbose "${APK}"
          echo "SHA-256:"
          sha256sum "${APK}" "${AAB}"
          echo "Artifacts:"
          ls -lh "${APK}" "${AAB}"

      - name: Upload verified APK artifact for download publisher
        uses: actions/upload-artifact@v4
        with:
          name: testagram-android-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing material
        if: always()
        run: rm -f android/testagram-release.jks android/keystore.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Testagram Android ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
