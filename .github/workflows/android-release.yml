name: Testagram Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.1)"
        required: true
        default: "v0.1.1"
  push:
    branches:
      - "release/*"

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish Testagram APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Restore dependencies
        run: flutter pub get

      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name testagram_mobile .
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Enforce HTTPS-only Android networking
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="false"', 1)
          p.write_text(s)
          PY

      - name: Build release APK and App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build apk --release             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          flutter build appbundle --release             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --verbose "$APK"

          echo "SHA-256:"
          sha256sum "$APK" "$AAB"
          echo "Artifacts:"
          ls -lh "$APK" "$AAB"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Testagram Android ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
