name: Android Ephemeral CI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ephemeral-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate ephemeral signing identity
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-signing
          STORE_PASS="$(openssl rand -hex 32)"
          KEY_PASS="$STORE_PASS"
          KEY_ALIAS="testagram-ci-${GITHUB_RUN_ID}"
          KEYSTORE="$PWD/ci-signing/testagram-ci.jks"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Testagram CI,O=Testagram,OU=CI"

          {
            echo "storeFile=$KEYSTORE"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt

          KEYSTORE="$PWD/ci-signing/testagram-ci.jks"
          STORE_PASS="$(sed -n 's/^storePassword=//p' keystore.properties)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' keystore.properties)"

          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > /tmp/keystore-cert.txt

          APK_SHA="$(sed -n 's/.*SHA-256 digest: //p' /tmp/apk-certs.txt | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          KEY_SHA="$(sed -n 's/.*SHA256: //p' /tmp/keystore-cert.txt | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"

          test -n "$APK_SHA"
          test -n "$KEY_SHA"
          test "$APK_SHA" = "$KEY_SHA"

          echo "SIGNATURE_VERIFICATION=PASS"
          echo "KEYSTORE_CERTIFICATE_MATCH=PASS"

      - name: Prepare APK artifact
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifact
          cp app/build/outputs/apk/release/app-release.apk ci-artifact/Testagram-ephemeral-${GITHUB_RUN_NUMBER}.apk
          sha256sum ci-artifact/Testagram-ephemeral-${GITHUB_RUN_NUMBER}.apk | tee ci-artifact/Testagram-ephemeral-${GITHUB_RUN_NUMBER}.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: testagram-ephemeral-apk-${{ github.run_number }}
          path: |
            android/ci-artifact/*.apk
            android/ci-artifact/*.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Delete ephemeral signing material
        if: always()
        working-directory: android
        shell: bash
        run: |
          rm -f keystore.properties
          rm -rf ci-signing
          rm -rf ci-artifact
