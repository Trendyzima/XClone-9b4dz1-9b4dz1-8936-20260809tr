name: Publish Testagram APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-testagram-apk.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download the verified Android release artifact
        uses: actions/download-artifact@v4
        with:
          name: testagram-android-release-27b974acc8f24fbebb5c566164615ed9ccad2052
          path: /tmp/testagram-artifact
          repository: Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr
          run-id: 37177519503
          github-token: ${{ github.token }}

      - name: Locate and publish APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/testagram-artifact -type f -name 'app-release.apk' -print -quit)"
          test -n "$APK"
          mkdir -p downloads
          cp "$APK" downloads/Testagram.apk
          sha256sum downloads/Testagram.apk > downloads/Testagram.apk.sha256

      - name: Update README download section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          marker = "## 📱 Testagram Android APK"
          start = s.index(marker)
          end = s.index("\n## What is Testagram?", start)
          block = """## 📱 Testagram Android APK

          The verified Testagram Android APK is available directly from this repository.

          ### Download Testagram

          **[⬇️ Download Testagram APK](https://github.com/Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr/raw/refs/heads/main/downloads/Testagram.apk)**

          **[SHA-256 checksum](https://github.com/Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr/blob/main/downloads/Testagram.apk.sha256)**

          BUILD_RUN_ID="37177519503"
          BUILD_CREATED_AT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .created_at)"
          BUILD_CREATED_EAT="$(BUILD_CREATED_AT="$BUILD_CREATED_AT" python3 - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          dt = datetime.fromisoformat(os.environ["BUILD_CREATED_AT"].replace("Z", "+00:00"))
          print(dt.astimezone(timezone(timedelta(hours=3))).strftime("%Y-%m-%d %H:%M EAT"))
          PY
          )"
          BUILD_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_sha)"
          export BUILD_RUN_ID BUILD_CREATED_EAT BUILD_COMMIT
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("README.md")
          s = p.read_text()
          marker = "## 📱 Testagram Android APK"
          start = s.index(marker)
          end = s.index("\n## What is Testagram?", start)
          block = f"""## 📱 Testagram Android APK

          The verified Testagram Android APK is available directly from this repository.

          ### Download Testagram

          **[⬇️ Download Testagram APK](https://github.com/Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr/raw/refs/heads/main/downloads/Testagram.apk)**

          **[SHA-256 checksum](https://github.com/Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr/blob/main/downloads/Testagram.apk.sha256)**

          **Created:** {os.environ["BUILD_CREATED_EAT"]}  
          **Build commit:** `{os.environ["BUILD_COMMIT"]}`  
          **GitHub Actions run:** [#{os.environ["BUILD_RUN_ID"]}](https://github.com/Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr/actions/runs/{os.environ["BUILD_RUN_ID"]})

          The creation time above is taken from the successful Android release workflow that produced the APK, not from the later README publication commit. The README uses the direct raw APK endpoint so the link downloads the binary instead of opening the GitHub blob viewer.
          """
          p.write_text(s[:start] + block.rstrip() + s[end:])
          PY
          """
          p.write_text(s[:start] + block.rstrip() + s[end:])
          PY

      - name: Commit APK and README
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md downloads/Testagram.apk downloads/Testagram.apk.sha256
          git diff --cached --quiet && exit 0
          git commit -m "chore(android): publish Testagram APK download"
          git push origin HEAD:main
