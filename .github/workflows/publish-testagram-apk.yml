name: Publish Testagram APK

on:
  workflow_run:
    workflows:
      - Testagram Android Release
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Resolve verified Android build
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          if [ -n "${WORKFLOW_RUN_ID}" ]; then
            run_id="${WORKFLOW_RUN_ID}"
          else
            run_id="$(gh api "repos/${REPOSITORY}/actions/workflows/android-release.yml/runs?status=success&per_page=20" --jq '.workflow_runs | map(select(.head_branch == "main" or (.head_branch | startswith("release/")))) | .[0].id')"
          fi
          test -n "${run_id}" && test "${run_id}" != "null"
          run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
          test "$(jq -r '.conclusion' <<<"${run_json}")" = "success"
          head_sha="$(jq -r '.head_sha' <<<"${run_json}")"
          created_at="$(jq -r '.run_started_at // .created_at' <<<"${run_json}")"
          artifact_name="testagram-android-release-${head_sha}"
          artifact_json="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_id="$(jq -r --arg name "${artifact_name}" '.artifacts[] | select(.name == $name and .expired == false) | .id' <<<"${artifact_json}" | head -n 1)"
          test -n "${artifact_id}" && test "${artifact_id}" != "null"
          {
            echo "run_id=${run_id}"
            echo "head_sha=${head_sha}"
            echo "created_at=${created_at}"
            echo "artifact_name=${artifact_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download the verified Android release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: /tmp/testagram-artifact
          repository: ${{ github.repository }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Locate and publish APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/testagram-artifact -type f -name 'app-release.apk' -print -quit)"
          test -n "$APK"
          mkdir -p downloads
          cp "$APK" downloads/Testagram.apk
          sha256sum downloads/Testagram.apk > downloads/Testagram.apk.sha256

      - name: Update README APK version history
        shell: bash
        env:
          BUILD_RUN_ID: "${{ steps.build.outputs.run_id }}"
          BUILD_CREATED_AT: "${{ steps.build.outputs.created_at }}"
          BUILD_COMMIT: "${{ steps.build.outputs.head_sha }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import os, re
          repo = "Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr"
          p = Path("README.md")
          s = p.read_text()
          marker = "## 📱 Testagram Android APK"
          start = s.index(marker)
          end = s.index("\n## What is Testagram?", start)
          dt = datetime.fromisoformat(os.environ["BUILD_CREATED_AT"].replace("Z", "+00:00"))
          created = dt.astimezone(timezone(timedelta(hours=3))).strftime("%Y-%m-%d %H:%M EAT")
          run_id = os.environ["BUILD_RUN_ID"]
          commit = os.environ["BUILD_COMMIT"]
          gradle = Path("android/app/build.gradle").read_text()
          match = re.search(r'versionName\s+"([^"]+)"', gradle)
          version = match.group(1) if match else "unknown"
          apk_url = "https://github.com/" + repo + "/raw/refs/heads/main/downloads/Testagram.apk"
          checksum_url = "https://github.com/" + repo + "/blob/main/downloads/Testagram.apk.sha256"
          run_url = "https://github.com/" + repo + "/actions/runs/" + run_id
          old = s[start:end]
          rows = [x for x in old.splitlines() if x.startswith("| **v") or x.startswith("| **Latest verified build**")]
          rows = [x for x in rows if not x.startswith("| **v" + version + "**")]
          rows.insert(0, "| **v" + version + "** | ✅ Verified | " + created + " | [⬇️ Download APK](" + apk_url + ") | [Actions run #" + run_id + "](" + run_url + ") · " + commit + " |")
          lines = ["## 📱 Testagram Android APK","","Live APK version history — updated automatically after every successful Android release. All build times are shown in **East Africa Time (EAT, UTC+3)**.","","### APK versions","","| Version | Status | Created (EAT) | APK | Build details |","|---|---|---|---|---|"] + rows + ["","### Always-current download","","**[⬇️ Download latest verified Testagram APK](" + apk_url + ")**","","**[SHA-256 checksum](" + checksum_url + ")**","","**Latest:** v" + version + " · " + created + " · commit `" + commit + "` · [Actions run #" + run_id + "](" + run_url + ")","","_Only successfully signed and apksigner-verified builds are published._",""]
          p.write_text(s[:start] + "\n".join(lines) + s[end:])
          PY
      - name: Commit APK and README
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Main can advance while the verified APK is being downloaded.\n          # Rebase before committing, then retry if another publication lands first.\n          git pull --rebase origin main\n\n          git add README.md downloads/Testagram.apk downloads/Testagram.apk.sha256\n          if git diff --cached --quiet; then\n            echo "No APK/README publication changes to commit."\n            exit 0\n          fi\n\n          git commit -m "chore(android): publish Testagram APK download"\n\n          for attempt in 1 2 3; do\n            if git push origin HEAD:refs/heads/main; then\n              echo "APK publication commit pushed successfully on attempt ${attempt}."\n              exit 0\n            fi\n            if (( attempt == 3 )); then\n              echo "::error::Could not push APK publication after ${attempt} attempts."\n              exit 1\n            fi\n            echo "Main advanced during APK publication; rebasing and retrying."\n            git pull --rebase origin main\n          done
