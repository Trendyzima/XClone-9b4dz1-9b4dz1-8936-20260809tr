name: Surgical TypeScript Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ts-errors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compiler-safe repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected source pattern not found: {path}: {old[:100]}')
              p.write_text(s.replace(old, new, 1))

          p = Path('src/types/lucide-react-compat.d.ts')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("""import 'lucide-react';\n\ndeclare module 'lucide-react' {\n  interface LucideProps {\n    title?: string;\n  }\n}\n""")

          replace('src/hooks/useSEO.ts', "type?: 'website' | 'article' | 'profile';", "type?: 'website' | 'article' | 'profile' | 'video.other';")

          replace('src/components/ui/slider.tsx',
            'export interface SliderProps extends React.InputHTMLAttributes<HTMLInputElement> {',
            'export interface SliderProps extends Omit<React.InputHTMLAttributes<HTMLInputElement>, "value" | "defaultValue" | "onChange" | "min" | "max" | "step"> {')
          replace('src/components/ui/slider.tsx',
            '  onValueChange?: (value: number[]) => void\n}',
            '  onValueChange?: (value: number[]) => void\n  onChange?: React.ChangeEventHandler<HTMLInputElement>\n}')

          replace('src/components/features/EditProfileDialog.tsx',
            '  onOpenChange: (open: boolean) => void;\n  onSuccess: () => void;',
            '  onOpenChange: (open: boolean) => void;\n  onSuccess: () => void;\n  profile?: any;')

          replace('src/components/features/PollCard.tsx',
            'interface PollCardProps {\n  poll: Poll;\n  postId: string;\n}',
            'interface PollCardProps {\n  poll?: Poll;\n  postId: string;\n}')
          replace('src/components/features/PollCard.tsx',
            'export function PollCard({ poll, postId }: PollCardProps) {\n  const { user } = useAuth();',
            '''export function PollCard({ poll, postId }: PollCardProps) {\n  const { user } = useAuth();\n  const [resolvedPoll, setResolvedPoll] = useState<Poll | null>(poll ?? null);''')
          replace('src/components/features/PollCard.tsx',
            '  const [pollData, setPollData] = useState(poll);',
            '  const [pollData, setPollData] = useState<Poll | null>(poll ?? null);')
          replace('src/components/features/PollCard.tsx',
            '  useEffect(() => { if (user) checkIfVoted(); }, [poll.id, user?.id]);',
            '''  useEffect(() => {\n    let cancelled = false;\n    if (poll) { setResolvedPoll(poll); setPollData(poll); return () => { cancelled = true; }; }\n    supabase.from('polls').select('*, options:poll_options(*)').eq('post_id', postId).maybeSingle()\n      .then(({ data }) => { if (!cancelled && data) { setResolvedPoll(data as Poll); setPollData(data as Poll); } });\n    return () => { cancelled = true; };\n  }, [poll, postId]);\n\n  useEffect(() => { if (user && resolvedPoll) checkIfVoted(); }, [resolvedPoll?.id, user?.id]);''')
          replace('src/components/features/PollCard.tsx',
            "    if (!user) return;\n    const { data } = await supabase\n      .from('poll_votes').select('option_id')\n      .eq('poll_id', poll.id).eq('user_id', user.id).maybeSingle();",
            "    if (!user || !resolvedPoll) return;\n    const { data } = await supabase\n      .from('poll_votes').select('option_id')\n      .eq('poll_id', resolvedPoll.id).eq('user_id', user.id).maybeSingle();")
          replace('src/components/features/PollCard.tsx',
            "    if (!user) { navigate('/auth'); return; }\n    if (voted) { toast.error('You already voted'); return; }\n    if (new Date() > new Date(poll.expires_at)) { toast.error('Poll has ended'); return; }",
            "    if (!user || !resolvedPoll) { navigate('/auth'); return; }\n    if (voted) { toast.error('You already voted'); return; }\n    if (new Date() > new Date(resolvedPoll.expires_at)) { toast.error('Poll has ended'); return; }")
          replace('src/components/features/PollCard.tsx',
            "    const { data: updated } = await supabase.from('polls').select('*, options:poll_options(*)').eq('id', poll.id).single();",
            "    const { data: updated } = await supabase.from('polls').select('*, options:poll_options(*)').eq('id', resolvedPoll.id).single();")
          replace('src/components/features/PollCard.tsx',
            '  const pct = (votes: number) => pollData.total_votes === 0 ? 0 : Math.round((votes / pollData.total_votes) * 100);\n  const isExpired = new Date() > new Date(poll.expires_at);\n  const timeLeft = Math.max(0, new Date(poll.expires_at).getTime() - Date.now());',
            '  if (!pollData) return null;\n\n  const pct = (votes: number) => pollData.total_votes === 0 ? 0 : Math.round((votes / pollData.total_votes) * 100);\n  const isExpired = new Date() > new Date(pollData.expires_at);\n  const timeLeft = Math.max(0, new Date(pollData.expires_at).getTime() - Date.now());')
          replace('src/components/features/PollCard.tsx',
            "await supabase.rpc('increment', { table_name: 'polls', row_id: poll.id, column_name: 'total_votes' });",
            "await supabase.rpc('increment', { table_name: 'polls', row_id: resolvedPoll.id, column_name: 'total_votes' });")
          replace('src/components/features/PollCard.tsx',
            "const { error } = await supabase.from('poll_votes').insert({ poll_id: poll.id, option_id: optionId, user_id: user.id });",
            "const { error } = await supabase.from('poll_votes').insert({ poll_id: resolvedPoll.id, option_id: optionId, user_id: user.id });")

          replace('src/pages/WalletPage.tsx',
            'const dayMap: Record<string, { inAmt: number; outAmt: number; count: number }> = {};',
            'const dayMap: Record<string, number> = {};')
          replace('src/pages/WalletPage.tsx',
            '    const dayMap: any = {};\n    for (let d = 1; d <= daysInMonth; d++) dayMap[d] = { inAmt: 0, outAmt: 0, count: 0 };',
            '    const dayMap: Record<number, { inAmt: number; outAmt: number; count: number }> = {};\n    for (let d = 1; d <= daysInMonth; d++) dayMap[d] = { inAmt: 0, outAmt: 0, count: 0 };')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'src'], check=True)
          PY
      - name: Commit source repairs
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: repair remaining TypeScript contracts"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/repair-ts-errors.yml
          git commit -m "chore: remove one-shot TypeScript repair workflow"
          git push origin HEAD:main
