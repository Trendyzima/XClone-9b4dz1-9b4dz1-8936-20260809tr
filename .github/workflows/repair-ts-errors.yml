name: Surgical TypeScript Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ts-errors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply idempotent compiler-safe repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path); s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, new, 1))

          # lucide-react's LucideProps does not expose the SVG title attribute.
          # Keep the existing accessible title usages type-safe without changing rendering.
          p = Path('src/types/lucide-react-compat.d.ts')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("""import 'lucide-react';\n\ndeclare module 'lucide-react' {\n  interface LucideProps {\n    title?: string;\n  }\n}\n""")

          replace_once('src/hooks/useSEO.ts', "type?: 'website' | 'article' | 'profile';", "type?: 'website' | 'article' | 'profile' | 'video.other';")

          slider = Path('src/components/ui/slider.tsx')
          ss = slider.read_text()
          if 'extends React.InputHTMLAttributes<HTMLInputElement>' in ss and 'extends Omit<React.InputHTMLAttributes<HTMLInputElement>' not in ss:
              ss = ss.replace('export interface SliderProps extends React.InputHTMLAttributes<HTMLInputElement> {', 'export interface SliderProps extends Omit<React.InputHTMLAttributes<HTMLInputElement>, "value" | "defaultValue" | "onChange" | "min" | "max" | "step"> {')
          if 'onChange?: React.ChangeEventHandler<HTMLInputElement>' not in ss and 'onValueChange?: (value: number[]) => void' in ss:
              ss = ss.replace('  onValueChange?: (value: number[]) => void', '  onValueChange?: (value: number[]) => void\n  onChange?: React.ChangeEventHandler<HTMLInputElement>')
          slider.write_text(ss)

          edit = Path('src/components/features/EditProfileDialog.tsx')
          es = edit.read_text()
          if 'profile?:' not in es:
              es = es.replace('  onSuccess: () => void;', '  onSuccess: () => void;\n  profile?: Record<string, unknown> | null;')
              edit.write_text(es)

          poll = Path('src/components/features/PollCard.tsx')
          ps = poll.read_text()
          # Current PollCard already resolves polls by postId. Legacy source is also supported idempotently.
          if 'poll?: Poll;' not in ps:
              ps = ps.replace('  poll: Poll;', '  poll?: Poll;')
          poll.write_text(ps)

          w = Path('src/pages/WalletPage.tsx')
          ws = w.read_text()
          ws = ws.replace('const dayMap: Record<string, { inAmt: number; outAmt: number; count: number }> = {};', 'const dayMap: Record<string, number> = {};', 1)
          ws = ws.replace('const dayMap: any = {};', 'const dayMap: Record<number, { inAmt: number; outAmt: number; count: number }> = {};', 1)
          w.write_text(ws)
          PY
      - name: Commit source repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No source changes required'
            exit 0
          fi
          git commit -m "fix: repair remaining TypeScript contracts"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/repair-ts-errors.yml
          git commit -m "chore: remove one-shot TypeScript repair workflow"
          git push origin HEAD:main
