name: Guard Against Reintroducing Hosted CDN

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/merge-first-party-cdn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the external Go CDN cannot be synced into production
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'repository: Trendyzima/cdn-|git push origin HEAD:main|rm -rf services/testagram-cdn' .github/workflows/merge-first-party-cdn.yml; then
            echo "::error::Automatic external CDN synchronization is forbidden in virtual-CDN mode."
            exit 1
          fi
          grep -Fq 'src/services/virtualCdnLoader.ts' .github/workflows/merge-first-party-cdn.yml
