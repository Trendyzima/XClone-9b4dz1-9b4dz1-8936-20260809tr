name: Firebase TV Hosting

on:
  push:
    branches: [main]
    paths:
      - "src/pages/TvChannelsPage.tsx"
      - "src/components/features/TvChannelPlayer.tsx"
      - "src/components/features/TestagramLiveChannelCard.tsx"
      - "src/services/tvChannelCatalog.ts"
      - "src/App.tsx"
      - "src/components/layout/Sidebar.tsx"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-tv-hosting.yml"
      - "package.json"
      - "package-lock.json"
      - "public/tv/**"
      - "scripts/build-tv-catalog.mjs"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: firebase-tv-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Testagram TV to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build worldwide TV catalogue (up to 20,000 channels)
        run: node scripts/build-tv-catalog.mjs

      - name: Build TV application
        run: npm run build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

      - name: Validate Firebase deployment configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e '.type == "service_account" and .project_id == "twitter-clone-ccrsxx-2513a" and (.client_email | type == "string") and (.private_key | type == "string")' >/dev/null
          echo "Firebase service account is valid for the expected project."
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: twitter-clone-ccrsxx-2513a
          target: testagram-tv
          channelId: live
