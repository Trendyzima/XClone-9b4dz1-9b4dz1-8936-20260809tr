name: Replication Contract PostgreSQL Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitive-key-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name xclone-replication-contract-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker exec xclone-replication-contract-ci pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs xclone-replication-contract-ci
          exit 1
      - name: Apply replication schema and parity migration
        run: |
          set -euo pipefail
          docker exec -i xclone-replication-contract-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
          docker exec -i xclone-replication-contract-ci psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261019000000_dual_backend_replication.sql
          docker exec -i xclone-replication-contract-ci psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261019020000_replication_sensitive_key_parity.sql
      - name: Verify peer-compatible sensitive key rejection
        run: |
          set -euo pipefail
          docker exec -i xclone-replication-contract-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $contract$
          DECLARE
            key_name TEXT;
            forbidden_keys TEXT[] := ARRAY[
              'email', 'email_address', 'phone', 'phone_number', 'password_hash',
              'private_key', 'api_key', 'accessToken', 'refresh-token', 'PasswordHash',
              'private.key', 'serviceRoleKey', 'serviceRole', 'signedURL', 'presigned-url',
              'phone number', 'providerCredentials', 'customerEmail', 'jwtToken',
              'jwt', 'bearer', 'passwd'
            ];
          BEGIN
            FOREACH key_name IN ARRAY forbidden_keys LOOP
              IF NOT public.platform_replication_has_forbidden_key(jsonb_build_object(key_name, 'must-not-cross')) THEN
                RAISE EXCEPTION 'sensitive key variant was accepted: %', key_name;
              END IF;
            END LOOP;
            IF NOT public.platform_replication_has_forbidden_key(
              '{"metadata":[{"nestedSecret":{"serviceRoleKey":"never-export"}}]}'::jsonb
            ) THEN
              RAISE EXCEPTION 'nested sensitive key was accepted';
            END IF;
            IF NOT public.platform_replication_has_forbidden_key(
              '{"avatar_url":"https://cdn.example/avatar?token=secret"}'::jsonb
            ) THEN
              RAISE EXCEPTION 'signed URL-valued field was accepted';
            END IF;
            IF public.platform_replication_has_forbidden_key(
              '{"username":"public_user","avatar_url":"https://cdn.example/avatar.png","visibility":"public"}'::jsonb
            ) THEN
              RAISE EXCEPTION 'valid public projection was rejected';
            END IF;
          END
          $contract$;
          SQL
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop xclone-replication-contract-ci || true
