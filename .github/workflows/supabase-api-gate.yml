name: Supabase API Connection Gate

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase production project ref"
        required: true
        default: ffrhglgkukgsuhxenena
        type: string
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-api-gate.yml"

permissions:
  contents: read

concurrency:
  group: supabase-api-gate
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Supabase Management API and Data API
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ inputs.project_ref || vars.SUPABASE_PROJECT_ID || 'ffrhglgkukgsuhxenena' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install deterministic Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Verify Management API authentication
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured for the production GitHub environment."
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_ID}" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is not configured."
            exit 1
          fi
          printf '::add-mask::%s\n' "${SUPABASE_ACCESS_TOKEN}"
          response_file="/tmp/supabase-projects.json"
          : > "${response_file}"
          set +e
          http_status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 --output "${response_file}" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects" 2>/tmp/supabase-management-curl.err)"
          curl_status=$?
          set -e
          if (( curl_status != 0 )); then
            echo "::error::Supabase Management API transport failed (curl exit ${curl_status})."
            cat /tmp/supabase-management-curl.err || true
            head -c 1200 "${response_file}" || true
            exit 1
          fi
          case "${http_status}" in
            200) ;;
            401)
              echo "::error::Supabase Management API rejected SUPABASE_ACCESS_TOKEN (HTTP 401 Unauthorized). Refresh/replace the token in the GitHub production environment."
              exit 1
              ;;
            403)
              echo "::error::Supabase Management API denied this token (HTTP 403 Forbidden). Check token scope/account access."
              exit 1
              ;;
            *)
              echo "::error::Supabase Management API returned HTTP ${http_status}."
              cat "${response_file}" || true
              exit 1
              ;;
          esac
          if ! jq -e --arg ref "${SUPABASE_PROJECT_ID}" '.[] | select(.ref == $ref)' "${response_file}" >/dev/null; then
            echo "::error::Authenticated successfully, but target project ${SUPABASE_PROJECT_ID} was not returned for this Supabase account."
            exit 1
          fi
          echo "Supabase Management API authentication: OK"
          echo "Target project: ${SUPABASE_PROJECT_ID}"

      - name: Verify Supabase Data API
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL}" ]]; then
            echo "::error::SUPABASE_URL is not configured for the production GitHub environment."
            exit 1
          fi
          if [[ -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "::error::A publishable/anon Supabase key is not configured for the production GitHub environment."
            exit 1
          fi
          printf '::add-mask::%s\n' "${SUPABASE_ANON_KEY}"

          # Create diagnostic files before curl. A transport timeout must not
          # trigger a second, misleading "file not found" error.
          response_headers="/tmp/supabase-health.headers"
          response_body="/tmp/supabase-health.json"
          curl_error="/tmp/supabase-health-curl.err"
          : > "${response_headers}"
          : > "${response_body}"
          : > "${curl_error}"

          set +e
          curl_metrics="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            --dump-header "${response_headers}" \
            --output "${response_body}" \
            --write-out '%{http_code} %{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=0" 2>"${curl_error}")"
          curl_status=$?
          set -e

          read -r status dns_seconds connect_seconds tls_seconds first_byte_seconds total_seconds <<< "${curl_metrics}"
          echo "Probe timing (seconds): dns=${dns_seconds:-unknown} connect=${connect_seconds:-unknown} tls=${tls_seconds:-unknown} first_byte=${first_byte_seconds:-unknown} total=${total_seconds:-unknown}"
          if (( curl_status != 0 )); then
            echo "::error::Supabase Data API transport failed (curl exit ${curl_status}); deadline is 20 seconds."
            cat "${curl_error}" || true
            grep -iE '^(HTTP/|content-type:|sb-error-code:|x-request-id:|cf-ray:)' "${response_headers}" || true
            if [[ -s "${response_body}" ]]; then
              head -c 1200 "${response_body}" || true
              echo
            else
              echo "Supabase Data API returned no response body."
            fi
            exit 1
          fi

          case "${status}" in
            200|206) echo "Supabase Data API: HTTP ${status}" ;;
            *)
              echo "::error::Supabase Data API health check failed with HTTP ${status}."
              grep -iE '^(HTTP/|content-type:|sb-error-code:|x-request-id:|cf-ray:)' "${response_headers}" || true
              head -c 1200 "${response_body}" || true
              exit 1
              ;;
          esac

      - name: Emit connection receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "SUPABASE_MANAGEMENT_API=CONNECTED"
          echo "SUPABASE_DATA_API=CONNECTED"
          echo "SUPABASE_PROJECT_ID=${SUPABASE_PROJECT_ID}"
          echo "SECRETS_EXPOSED=NO"
