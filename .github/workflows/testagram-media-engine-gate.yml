name: Testagram Media Engine Gate
on:
  push:
    paths:
      - "media-engine/**"
      - "src/lib/testagramMedia.ts"
      - "src/pages/TvStudioPage.tsx"
      - "src/pages/TvPublicLivePage.tsx"
      - "supabase/functions/testagram-media-token/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "media-engine/**"
      - "src/lib/testagramMedia.ts"
      - "src/pages/TvStudioPage.tsx"
      - "src/pages/TvPublicLivePage.tsx"
      - "supabase/functions/testagram-media-token/**"
      - "package.json"
      - "package-lock.json"

jobs:
  media-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go mod tidy
      - run: go test ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
