name: Profile feature sidebar
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add feature sidebar
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/ProfilePage.tsx')
          s = p.read_text()
          if 'function ProfileFeatureRail(' in s:
              raise SystemExit('ProfileFeatureRail already exists; refusing duplicate patch.')
          marker = 'export default function ProfilePage() {'
          if marker not in s:
              raise SystemExit('ProfilePage component marker not found; refusing patch.')
          component = r'''function ProfileFeatureRail({ userId }: { userId: string | null }) {
  const [open, setOpen] = useState(false);
  const [saving, setSaving] = useState(false);
  const [settings, setSettings] = useState<Record<string, boolean>>({
    analytics: true,
    monetization: true,
    podcasts: true,
    series: true,
    achievements: true,
    highlights: true,
    'social-links': true,
    tips: true,
  });

  const features = [
    { key: 'analytics', title: 'Analytics', description: 'Profile and content performance', icon: AreaChart },
    { key: 'monetization', title: 'Monetization', description: 'Subscriptions and creator earnings', icon: DollarSign },
    { key: 'podcasts', title: 'Podcasts', description: 'Podcast presence on your profile', icon: Headphones },
    { key: 'series', title: 'Series', description: 'Serialized content destination', icon: BookOpen },
    { key: 'achievements', title: 'Achievements', description: 'Milestones and creator badges', icon: Star },
    { key: 'highlights', title: 'Story Highlights', description: 'Saved story collections', icon: Eye },
    { key: 'social-links', title: 'Social Links', description: 'External social profiles', icon: Globe },
    { key: 'tips', title: 'Tips', description: 'Let visitors discover tipping', icon: Gift },
  ];

  useEffect(() => {
    if (!userId) return;
    let cancelled = false;
    void supabase.from('profiles').select('profile_features').eq('id', userId).maybeSingle().then(({ data }) => {
      if (!cancelled) setSettings(prev => ({ ...prev, ...(data?.profile_features ?? {}) }));
    });
    return () => { cancelled = true; };
  }, [userId]);

  const toggle = async (key: string) => {
    if (!userId || saving) return;
    const next = { ...settings, [key]: !settings[key] };
    const previous = settings;
    setSettings(next);
    setSaving(true);
    const { error } = await supabase.from('profiles').update({ profile_features: next }).eq('id', userId);
    setSaving(false);
    if (error) {
      setSettings(previous);
      toast.error('Could not save that feature setting');
      return;
    }
    const label = features.find(feature => feature.key === key)?.title ?? 'Feature';
    toast.success(`${label} ${next[key] ? 'enabled' : 'disabled'}`);
  };

  if (!userId) return null;
  const enabledCount = features.filter(feature => settings[feature.key]).length;

  return (
    <>
      <button
        type="button"
        onClick={() => setOpen(value => !value)}
        aria-expanded={open}
        aria-controls="profile-feature-sidebar"
        aria-label="Open profile feature controls"
        title="Profile features"
        className="relative z-40 inline-flex items-center gap-1.5 rounded-full border border-primary/30 bg-primary/10 px-3 py-2 text-sm font-semibold text-primary shadow-sm transition-all hover:bg-primary/15 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-primary/30"
      >
        <Sparkles className="h-3.5 w-3.5" />
        <span className="hidden sm:inline">Features</span>
        <span className="min-w-5 rounded-full bg-primary px-1.5 py-0.5 text-[10px] leading-4 text-primary-foreground">{enabledCount}</span>
      </button>

      {open && (
        <>
          <button type="button" aria-label="Close profile feature controls" onClick={() => setOpen(false)} className="fixed inset-0 z-[70] bg-black/10 backdrop-blur-[1px]" />
          <aside id="profile-feature-sidebar" aria-label="Profile feature controls" className="fixed right-3 top-16 z-[80] w-[min(360px,calc(100vw-24px))] overflow-hidden rounded-3xl border border-border/80 bg-background/95 shadow-2xl backdrop-blur-xl">
            <div className="flex items-center justify-between border-b border-border/70 px-4 py-3">
              <div className="min-w-0">
                <p className="text-sm font-black">Profile features</p>
                <p className="text-[11px] text-muted-foreground">{enabledCount} of {features.length} enabled</p>
              </div>
              <button type="button" onClick={() => setOpen(false)} aria-label="Close" className="rounded-full p-2 text-muted-foreground transition-colors hover:bg-muted hover:text-foreground"><X className="h-4 w-4" /></button>
            </div>
            <div className="max-h-[min(70vh,620px)] overflow-y-auto p-2">
              {features.map(feature => {
                const Icon = feature.icon;
                const enabled = !!settings[feature.key];
                return (
                  <div key={feature.key} className="flex items-center gap-3 rounded-2xl px-3 py-3 transition-colors hover:bg-muted/50">
                    <div className={`flex h-9 w-9 shrink-0 items-center justify-center rounded-xl ${enabled ? 'bg-primary/10 text-primary' : 'bg-muted text-muted-foreground'}`}><Icon className="h-4 w-4" /></div>
                    <div className="min-w-0 flex-1"><p className="truncate text-xs font-bold">{feature.title}</p><p className="mt-0.5 truncate text-[10px] text-muted-foreground">{feature.description}</p></div>
                    <button type="button" role="switch" aria-checked={enabled} aria-label={`${enabled ? 'Disable' : 'Enable'} ${feature.title}`} disabled={saving} onClick={() => void toggle(feature.key)} className={`relative h-6 w-11 shrink-0 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary/30 disabled:opacity-50 ${enabled ? 'bg-primary' : 'bg-muted-foreground/25'}`}><span className={`absolute top-1 h-4 w-4 rounded-full bg-white shadow-sm transition-transform ${enabled ? 'translate-x-6' : 'translate-x-1'}`} /></button>
                  </div>
                );
              })}
            </div>
            <div className="border-t border-border/70 px-4 py-3"><button type="button" onClick={() => { setOpen(false); }} className="w-full rounded-xl bg-muted px-3 py-2 text-xs font-bold hover:bg-muted/80">Done</button></div>
          </aside>
        </>
      )}
    </>
  );
}

'''
          s = s.replace(marker, component + marker, 1)
          old = '''<button onClick={() => navigate('/profile-features')} aria-label="Profile features" title="Profile features" className="ml-auto inline-flex items-center gap-1.5 px-3 py-2 border border-primary/30 bg-primary/10 text-primary rounded-full font-semibold text-sm hover:bg-primary/15 transition-colors shadow-sm">\n                    <Sparkles className="w-3.5 h-3.5" />\n                    <span className="hidden sm:inline">Features</span>\n                  </button>'''
          if old not in s:
              raise SystemExit('Expected upper-right feature button not found; refusing patch.')
          new = '<ProfileFeatureRail userId={currentUser?.id ?? null} />'
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Verify source
        run: |
          grep -q 'function ProfileFeatureRail' src/pages/ProfilePage.tsx
          grep -q 'profile-feature-sidebar' src/pages/ProfilePage.tsx
          grep -q "profile_features: next" src/pages/ProfilePage.tsx
          grep -q '<ProfileFeatureRail userId={currentUser?.id ?? null} />' src/pages/ProfilePage.tsx
      - name: Typecheck lint build
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ProfilePage.tsx
          git commit -m 'feat(profile): add right-side feature toggle panel'
          git push origin main
          git rm .github/workflows/profile-feature-sidebar.yml
          git commit -m 'chore: remove one-time profile feature sidebar workflow'
          git push origin main
