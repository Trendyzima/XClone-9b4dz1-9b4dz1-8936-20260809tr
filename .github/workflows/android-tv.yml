name: XClone Android TV

on:
  pull_request:
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"
  push:
    branches: [main]
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xclone-android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-debug-apk:
    name: Build and verify XClone TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build TV debug APK
        working-directory: android-tv
        run: ../android/gradlew --no-daemon clean assembleDebug

      - name: Verify TV APK and manifest metadata
        working-directory: android-tv
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            echo "Android SDK command-line tools available."
          fi
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -o -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/xclone-tv-badging.txt
          grep -q "package: name='com.xclone.app.tv.debug'" /tmp/xclone-tv-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/xclone-tv-manifest.txt
          grep -q "android.intent.category.LEANBACK_LAUNCHER" /tmp/xclone-tv-manifest.txt
          grep -q "android.hardware.touchscreen" /tmp/xclone-tv-manifest.txt
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload XClone TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xclone-tv-debug-apk-${{ github.sha }}
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
