name: Historical Production Signing Key Forensics v2

on:
  push:
    branches:
      - forensic/historical-signing-key-v2
  workflow_dispatch:
    inputs:
      reference_fingerprint:
        description: "Known-good production APK certificate SHA-256"
        required: true
        default: "E7:17:82:7E:F5:85:3D:0C:EF:A0:4B:35:77:09:CC:9C:80:FC:F1:5F:7C:D6:75:55:A1:BD:A0:75:13:A6:AC:9"

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify production certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REFERENCE_FINGERPRINT: ${{ inputs.reference_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          normalize() { printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]'; }
          TARGET="$(normalize "$REFERENCE_FINGERPRINT")"
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          mapfile -t BLOBS < <(git rev-list --objects --all | awk '$2=="keystore-base64.txt"{print $1}' | sort -u)
          test "${#BLOBS[@]}" -gt 0 || { echo "::error::No historical keystore candidates"; exit 2; }
          matches=0
          mkdir -p /tmp/forensics
          for BLOB in "${BLOBS[@]}"; do
            B64="/tmp/forensics/$BLOB.b64"; JKS="/tmp/forensics/$BLOB.jks"; CERT="/tmp/forensics/$BLOB.pem"
            git cat-file blob "$BLOB" > "$B64"
            if ! tr -d '\r\n ' < "$B64" | base64 --decode > "$JKS" 2>/dev/null; then
              echo "CANDIDATE $BLOB: invalid Base64"; rm -f "$B64" "$JKS"; continue
            fi
            FP=""
            if keytool -list -v -keystore "$JKS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$JKS.txt" 2>/dev/null; then
              FP="$(awk -F': ' '/SHA256:/{print $2;exit}' "$JKS.txt" | tr -d '[:space:]')"
              ALIAS="$(awk -F': ' '/Alias name:/{print $2;exit}' "$JKS.txt" | tr -d '[:space:]')"
              echo "CANDIDATE $BLOB: alias=${ALIAS:-unknown} certificate=${FP:-unavailable} password=VALID"
            else
              if python3 - "$JKS" "$CERT" <<'PY'
import struct,sys,base64
from pathlib import Path
d=Path(sys.argv[1]).read_bytes(); o=Path(sys.argv[2]); p=4
def u4():
 global p
 v=struct.unpack(">I",d[p:p+4])[0]; p+=4; return v
def u8():
 global p
 p+=8
def utf():
 global p
 n=struct.unpack(">H",d[p:p+2])[0]; p+=2
 x=d[p:p+n].decode("utf-8"); p+=n; return x
def blob(n):
 global p
 x=d[p:p+n]; p+=n; return x
if struct.unpack(">I",d[:4])[0]!=0xFEEDFEED: raise ValueError("not JKS")
if u4() not in (1,2): raise ValueError("unsupported JKS")
count=u4(); certs=[]
for _ in range(count):
 tag=u4(); utf(); u8()
 if tag==1:
  blob(u4()); n=u4()
  for _ in range(n): utf(); certs.append(blob(u4()))
 elif tag==2:
  utf(); certs.append(blob(u4()))
 else: raise ValueError("unknown entry")
if not certs: raise ValueError("no certificates")
o.write_bytes(b"".join(b"-----BEGIN CERTIFICATE-----\n"+base64.b64encode(c)+b"\n-----END CERTIFICATE-----\n" for c in certs))
PY
              then FP="$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 2>/dev/null | sed 's/^sha256 Fingerprint=//')"
              else echo "CANDIDATE $BLOB: unable to parse as JKS"; rm -f "$B64" "$JKS" "$JKS.txt" "$CERT"; continue; fi
              echo "CANDIDATE $BLOB: certificate=$FP password=UNKNOWN"
            fi
            if [ -n "$FP" ] && [ "$(normalize "$FP")" = "$TARGET" ]; then
              echo "::notice::MATCH — $BLOB contains the known-good production signing certificate."
              matches=$((matches+1))
            fi
            rm -f "$B64" "$JKS" "$JKS.txt" "$CERT"
          done
          echo "Historical candidates examined: ${#BLOBS[@]}"
          echo "Production-identity matches: $matches"
          if [ "$matches" -eq 1 ]; then echo "MATCH FOUND — preserve this signing identity."; exit 0; fi
          if [ "$matches" -gt 1 ]; then echo "::error::Multiple candidates match the production certificate"; exit 3; fi
          echo "::error::No historical candidate contains the production certificate"; exit 4
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/forensics
