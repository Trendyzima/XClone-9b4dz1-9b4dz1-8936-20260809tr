plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xclone.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xclone.app.tv'
        minSdk 24
        targetSdk 36
        versionCode (providers.gradleProperty('tvVersionCode').orNull ?: '1').toInteger()
        versionName providers.gradleProperty('tvVersionName').orNull ?: '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            // Injected only by the protected release workflow; never commit signing material.
            def storePath = providers.gradleProperty('XCLONE_TV_STORE_FILE').orNull
            if (storePath) {
                storeFile file(storePath)
                storePassword providers.gradleProperty('XCLONE_TV_STORE_PASSWORD').get()
                keyAlias providers.gradleProperty('XCLONE_TV_KEY_ALIAS').get()
                keyPassword providers.gradleProperty('XCLONE_TV_KEY_PASSWORD').get()
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
