[auth]
enable_anonymous_sign_ins = false

[functions.capability-gateway]
verify_jwt = false

[functions.community-admin-runtime]
verify_jwt = false

[functions.gateway-relay]
verify_jwt = false

# The handler validates an optional user JWT itself and serves only public items to anonymous readers.
[functions.federated-feed]
verify_jwt = false

[functions.megalodon-gateway]
verify_jwt = true

[functions.testagram-rss-feed]
verify_jwt = false

[functions.tv-catalog]
verify_jwt = false

# Public media proxy: the browser cannot attach a Supabase JWT to HLS.js media requests.
# The function performs its own public-stream/SSRF validation.
[functions.tv-stream-proxy]
verify_jwt = false

# TV supports anonymous public viewer lookup, invite-token guest joins, and authenticated
# host actions. The handler validates host JWTs and guest invite/encoder tokens itself.
[functions.tv-media-control]
verify_jwt = false

[functions.register-push-token]
verify_jwt = true

[functions.novu-notification-delivery]
verify_jwt = false

[functions.notification-delivery-worker]
verify_jwt = false

[functions.newsify-feed]
verify_jwt = false

[functions.newsify-sync]
verify_jwt = false

[functions.notification-fcm-worker]
verify_jwt = false

[functions.identity-verification]
verify_jwt = false

[functions.identity-engine-result]
verify_jwt = false

# Do not impose a fixed 24-hour maximum session lifetime. Supabase refresh-token
# rotation, revocation, password changes and project abuse protections remain active.


[functions.tv-cdn-playback]
verify_jwt = false


# Public ad serving and signed impression events perform their own identity,
# event-token, owner, and rate-limit checks inside the handler.
[functions.testagram-ads]
verify_jwt = false

# Public, read-only SportScore proxy used by the Sports Hub.
[functions.testagram-sports]
verify_jwt = false

# Public ActivityPub media is copied to Testagram storage after strict SSRF, MIME and size checks.
[functions.federated-media]
verify_jwt = false


# Public trending discovery returns only public/unlisted federated objects; user personalization is optional.
[functions.federated-discovery-feed]
verify_jwt = false
