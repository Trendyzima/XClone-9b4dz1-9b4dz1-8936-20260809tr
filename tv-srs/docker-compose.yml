services:
  testagram-tv-srs:
    image: ossrs/srs:v6
    restart: unless-stopped
    command: ["./objs/srs", "-c", "/etc/srs/srs.conf"]
    environment:
      CANDIDATE: ${SRS_PUBLIC_IP:?set SRS_PUBLIC_IP}
    volumes:
      - ./srs.conf:/etc/srs/srs.conf:ro
    expose:
      - "1935"
      - "1985"
    ports:
      - "8000:8000/udp"
      - "8000:8000/tcp"
    networks:
      - testagram-media

networks:
  testagram-media:
    external: true
    name: media-engine_default
