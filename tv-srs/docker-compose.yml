services:
  srs:
    image: ossrs/srs:v6
    restart: unless-stopped
    command: ["./objs/srs", "-c", "/etc/srs/srs.conf"]
    environment:
      CANDIDATE: ${SRS_PUBLIC_IP:?set SRS_PUBLIC_IP}
    volumes:
      - ./srs.conf:/etc/srs/srs.conf:ro
    expose:
      - "1935"
      - "1985"
    ports:
      - "8000:8000/udp"
      - "8000:8000/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1985/api/v1/versions >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      srs:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
